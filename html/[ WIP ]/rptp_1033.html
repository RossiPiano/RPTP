<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Skill Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #e1e1e1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 1400px;
            max-width: 100%;
            background: linear-gradient(145deg, #14141f, #1a1a2e);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a4a;
            display: flex;
            gap: 30px;
            min-height: 700px;
        }

        /* Left: Skill Tree */
        .skill-tree-container {
            flex: 1;
            min-width: 0;
        }

        /* Right: Video Panel */
        .video-panel {
            width: 380px;
            background: #0a0a12;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            max-height: 700px;
        }

        .video-panel .panel-header {
            font-size: 16px;
            font-weight: 600;
            color: #f7d94e;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
            text-align: center;
        }

        .video-panel .panel-header .skill-name {
            color: #e1e1e1;
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .video-list::-webkit-scrollbar {
            width: 4px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .video-item-btn {
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 12px 16px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .video-item-btn:hover {
            background: #2a2a4a;
            border-color: #4a9eff;
            transform: translateX(4px);
        }

        .video-item-btn .video-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-btn .video-title {
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-item-btn .video-channel {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .video-item-btn .video-duration {
            font-size: 11px;
            color: #555;
            background: #0a0a12;
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .video-item-btn .play-icon {
            color: #4a9eff;
            font-size: 18px;
            flex-shrink: 0;
        }

        .no-videos {
            color: #555;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }

        .no-videos .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #f7d94e, #f0a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header .stats {
            display: flex;
            gap: 20px;
            background: #0a0a12;
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .header .stats span {
            color: #8888aa;
            font-size: 13px;
        }

        .header .stats .value {
            color: #f7d94e;
            font-weight: 700;
            font-size: 16px;
        }

        .reset-btn {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            color: #ff6b6b;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #3a1a1a;
            border-color: #ff6b6b;
        }

        /* Skill Tree Grid */
        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 5px 0;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .skill-tree::-webkit-scrollbar {
            width: 4px;
        }
        .skill-tree::-webkit-scrollbar-track {
            background: transparent;
        }
        .skill-tree::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            position: relative;
        }

        /* Skill Node */
        .skill-node {
            background: linear-gradient(145deg, #1a1a30, #222244);
            border: 2px solid #2a2a5a;
            border-radius: 14px;
            padding: 14px 16px;
            width: 160px;
            min-height: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .skill-node:hover {
            transform: translateY(-4px);
            border-color: #f7d94e;
            box-shadow: 0 8px 30px rgba(247, 217, 78, 0.15);
        }

        .skill-node.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .skill-node.locked:hover {
            transform: none;
            border-color: #2a2a5a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .skill-node.unlocked {
            border-color: #4a9eff;
            background: linear-gradient(145deg, #1a2a4a, #1a2a5a);
        }

        .skill-node.unlocked:hover {
            border-color: #6ab0ff;
        }

        .skill-node.mastered {
            border-color: #f7d94e;
            background: linear-gradient(145deg, #2a2a1a, #3a2a1a);
            box-shadow: 0 0 30px rgba(247, 217, 78, 0.1);
        }

        .skill-node.mastered:hover {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(247, 217, 78, 0.2);
        }

        .skill-node.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.2);
        }

        .skill-node .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .skill-node .name {
            font-size: 12px;
            font-weight: 600;
            color: #eee;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .skill-node .description {
            font-size: 10px;
            color: #8888aa;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .skill-node .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.locked {
            background: #2a2a3a;
            color: #666;
        }

        .status-badge.unlocked {
            background: #1a4a7a;
            color: #6ab0ff;
        }

        .status-badge.mastered {
            background: #7a6a1a;
            color: #f7d94e;
        }

        .skill-node .cost {
            font-size: 10px;
            color: #8888aa;
            margin-top: 4px;
        }

        .skill-node .cost span {
            color: #f7d94e;
            font-weight: 700;
        }

        .skill-node .video-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4a9eff;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid #1a1a2e;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8888aa;
        }

        .legend-item .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid;
        }

        .dot.locked {
            background: #1a1a30;
            border-color: #2a2a5a;
        }
        .dot.unlocked {
            background: #1a4a7a;
            border-color: #4a9eff;
        }
        .dot.mastered {
            background: #7a6a1a;
            border-color: #f7d94e;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .app {
                flex-direction: column;
                padding: 20px;
            }
            .video-panel {
                width: 100%;
                max-height: 400px;
            }
            .skill-node {
                width: 140px;
                min-height: 110px;
                padding: 12px;
            }
        }

        @media (max-width: 600px) {
            .app {
                padding: 12px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header .stats {
                font-size: 12px;
                padding: 6px 12px;
                gap: 12px;
            }
            .skill-node {
                width: 100%;
                min-height: 90px;
            }
            .skill-row {
                flex-direction: column;
                align-items: center;
            }
            .video-panel {
                max-height: 350px;
            }
            .video-item-btn {
                padding: 10px 12px;
            }
            .video-item-btn .video-title {
                font-size: 12px;
            }
        }
    </style>
</head>

<div class="app">

        <!-- Header -->
        <div class="header">
            <h1>🎹 Piano Skill Tree</h1>

                <button class="reset-btn" onclick="resetSkills()">⟳ Reset</button>
            </div>
        </div>

        <!-- Skill Tree -->
        <div class="skill-tree" id="skill-tree">
            <!-- Dynamically generated -->
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><span class="dot locked"></span> Locked</div>
            <div class="legend-item"><span class="dot unlocked"></span> Unlocked</div>
            <div class="legend-item"><span class="dot mastered"></span> Mastered</div>
            <div class="legend-item" style="color:#8888aa;">💡 Click a skill to see tutorials</div>
        </div>
    </div>

    <!-- Right: Video Panel -->

            <div class="no-videos">

                Click a skill on the left<br>to see YouTube tutorials

        </div>
    </div>
</div>

            ]
        }
    };

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let skillPoints = 0;
    let unlockedSkills = new Set();
    let masteredSkills = new Set();
    let selectedSkillId = null;

    // ============================================================
    // 3. RENDER FUNCTIONS
    // ============================================================
    function getSkillStatus(skillId) {
        if (masteredSkills.has(skillId)) return 'mastered';
        if (unlockedSkills.has(skillId)) return 'unlocked';
        return 'locked';
    }

    function isSkillAvailable(skill) {
        if (unlockedSkills.has(skill.id) || masteredSkills.has(skill.id)) return true;
        if (skill.prerequisites.length === 0) return true;
        return skill.prerequisites.every(prereqId => masteredSkills.has(prereqId));
    }

    function getSkillCost(skillId) {
        return skillData[skillId].cost;
    }

    function unlockSkill(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        if (unlockedSkills.has(skillId) || masteredSkills.has(skillId)) return;
        if (!isSkillAvailable(skill)) {
            alert('⚠️ You need to master the prerequisites first!');
            return;
        }
        if (skillPoints < skill.cost) {
            alert('⚠️ Not enough skill points! You need ' + skill.cost + ' points.');
            return;
        }
        skillPoints -= skill.cost;
        unlockedSkills.add(skillId);
        renderSkillTree();
        updateStats();
    }

    function masterSkill(skillId) {
        if (!unlockedSkills.has(skillId)) return;
        if (masteredSkills.has(skillId)) return;
        masteredSkills.add(skillId);
        unlockedSkills.delete(skillId);
        skillPoints += 1;
        renderSkillTree();
        updateStats();
    }

    function resetSkills() {
        if (confirm('Reset all progress? This cannot be undone.')) {
            skillPoints = 0;
            unlockedSkills = new Set();
            masteredSkills = new Set();
            selectedSkillId = null;
            renderSkillTree();
            updateStats();
            showSkillVideos(null);
        }
    }

    function selectSkill(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;

        // Check if skill is unlocked or mastered to view videos
        if (!unlockedSkills.has(skillId) && !masteredSkills.has(skillId)) {
            if (skill.videos && skill.videos.length > 0) {
                alert('🔒 Unlock or master this skill first to access the tutorials!');
            }
            return;
        }

        selectedSkillId = skillId;
        showSkillVideos(skillId);
        renderSkillTree();
    }

    function showSkillVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            panelName.textContent = 'Select a Skill';
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">🎵</span>
                    Click a skill on the left<br>to see YouTube tutorials
                </div>
            `;
            return;
        }

        const skill = skillData[skillId];
        panelName.textContent = skill.icon + ' ' + skill.name;

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">📺</span>
                    No tutorials available yet<br>for this skill
                </div>
            `;
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">🎬</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">▶</span>
                </a>
            `;
        }
        videoList.innerHTML = html;
    }

    function handleSkillClick(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;

        const status = getSkillStatus(skillId);

        if (status === 'locked') {
            if (isSkillAvailable(skill)) {
                unlockSkill(skillId);
            } else {
                alert('⚠️ You need to master the prerequisites first!\n\n' +
                      'Required: ' + skill.prerequisites.map(id => skillData[id].name).join(', '));
            }
        } else if (status === 'unlocked') {
            masterSkill(skillId);
            setTimeout(() => {
                selectSkill(skillId);
            }, 100);
        } else if (status === 'mastered') {
            selectSkill(skillId);
        }
    }

    function renderSkillTree() {
        const container = document.getElementById('skill-tree');

        const tiers = {};
        for (const [id, skill] of Object.entries(skillData)) {
            const tier = skill.tier || 1;
            if (!tiers[tier]) tiers[tier] = [];
            tiers[tier].push(skill);
        }

        const sortedTiers = Object.keys(tiers).sort((a, b) => a - b);

        let html = '';
        for (const tier of sortedTiers) {
            html += '<div class="skill-row">';
            const skills = tiers[tier].sort((a, b) => a.name.localeCompare(b.name));

            for (const skill of skills) {
                const status = getSkillStatus(skill.id);
                const isAvailable = isSkillAvailable(skill);
                const cost = getSkillCost(skill.id);
                const isSelected = selectedSkillId === skill.id;
                const hasVideos = skill.videos && skill.videos.length > 0;
                const videoCount = hasVideos ? skill.videos.length : 0;

                let statusText = '🔒 Locked';
                let statusClass = 'locked';

                if (status === 'unlocked') {
                    statusText = '🔓 Unlocked';
                    statusClass = 'unlocked';
                } else if (status === 'mastered') {
                    statusText = '⭐ Mastered';
                    statusClass = 'mastered';
                }

                const selectedClass = isSelected ? ' active' : '';

                html += `
                    <div class="skill-node ${statusClass}${selectedClass}" onclick="handleSkillClick('${skill.id}')" title="${skill.description}">
                        ${videoCount > 0 ? `<span class="video-badge">📺 ${videoCount}</span>` : ''}
                        <span class="icon">${skill.icon}</span>
                        <div class="name">${skill.name}</div>
                        <div class="description">${skill.description}</div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <div class="cost">💰 Cost: <span>${cost}</span> pts</div>
                    </div>
                `;
            }
            html += '</div>';
        }

        container.innerHTML = html;
    }

    function updateStats() {
        document.getElementById('skill-points').textContent = skillPoints;
        document.getElementById('unlocked-count').textContent = masteredSkills.size + unlockedSkills.size;
        document.getElementById('total-skills').textContent = Object.keys(skillData).length;
    }

    // ============================================================
    // 4. INITIALIZE
    // ============================================================
    function init() {
        skillPoints = 5;
        renderSkillTree();
        updateStats();
        showSkillVideos(null);

        console.log('🎹 Piano Skill Tree loaded!');
        console.log('💡 Click a skill to unlock/master it.');
        console.log('💡 Click a mastered/unlocked skill to see YouTube tutorials.');
        console.log('📺 Each video opens on YouTube.com in a new tab.');
    }

    init();
</script>
