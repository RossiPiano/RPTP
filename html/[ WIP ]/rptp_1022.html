<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video File Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #e1e1e1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 900px;
            max-width: 98vw;
            height: 700px;
            max-height: 95vh;
            background: #1e1e1e;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .toolbar {
            padding: 16px 24px;
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .toolbar h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .toolbar span {
            color: #aaa;
            font-size: 14px;
            background: #3a3a3a;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .tree-panel {
            flex: 1;
            background: #161616;
            padding: 16px 0;
            overflow-y: auto;
        }

        .tree-panel::-webkit-scrollbar {
            width: 6px;
        }
        .tree-panel::-webkit-scrollbar-track {
            background: #161616;
        }
        .tree-panel::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 8px;
        }

        .folder-item, .video-item {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.1s;
            border-left: 3px solid transparent;
            gap: 10px;
        }

        .folder-item {
            color: #8ab4f8;
            font-weight: 500;
        }
        .folder-item:hover {
            background: #2a2a2a;
        }

        .video-item {
            color: #ccc;
            padding-left: 44px;
            font-size: 14px;
            text-decoration: none;
        }
        .video-item:hover {
            background: #252525;
            color: #fff;
        }

        .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .empty-folder {
            padding: 20px;
            color: #555;
            text-align: center;
        }

        @media (max-width: 700px) {
            .video-item {
                padding-left: 36px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="toolbar">
        <h1>📁 Video Explorer</h1>
        <span id="path-display">root</span>
    </div>

    <div class="tree-panel" id="tree-panel">
        <!-- Dynamically generated -->
    </div>
</div>

<script>
    // ============================================================
    // 1. YOUR VIDEO LIBRARY - Add your YouTube URLs here
    // ============================================================
    const VIDEO_LIBRARY = {
        // Your piano tutorial
        'piano-beginners': 'https://www.youtube.com/watch?v=QBH6IpRkVDs',

        // Tutorials
        'html-crash': 'https://www.youtube.com/watch?v=qz0aGYrrlhU',
        'css-crash': 'https://www.youtube.com/watch?v=yfoY53QX49I',
        'js-crash': 'https://www.youtube.com/watch?v=hdI2bqOjy3c',
        'python-crash': 'https://www.youtube.com/watch?v=rfscVS0vtbw',

        // Music
        'rick-astley': 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
        'adele-hello': 'https://www.youtube.com/watch?v=YQHsXMglC9A',
        'ed-sheeran': 'https://www.youtube.com/watch?v=JGwWNGJdvx8',
        'weeknd-blinding': 'https://www.youtube.com/watch?v=fHI8X4OXluQ'
    };

    // ============================================================
    // 2. YOUR FOLDER STRUCTURE - Organize your videos here
    // ============================================================
    const fileTree = {
        name: 'root',
        type: 'folder',
        children: [
            {
                name: '🎹 Piano Tutorials',
                type: 'folder',
                children: [
                    {
                        name: 'How to Play Piano for Beginners',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['piano-beginners']
                    }
                ]
            },
            {
                name: '📚 Tutorials',
                type: 'folder',
                children: [
                    {
                        name: 'HTML Crash Course',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['html-crash']
                    },
                    {
                        name: 'CSS Crash Course',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['css-crash']
                    },
                    {
                        name: 'JavaScript Crash Course',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['js-crash']
                    },
                    {
                        name: 'Python Crash Course',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['python-crash']
                    }
                ]
            },
            {
                name: '🎵 Music Videos',
                type: 'folder',
                children: [
                    {
                        name: 'Rick Astley - Never Gonna Give You Up',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['rick-astley']
                    },
                    {
                        name: 'Adele - Hello',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['adele-hello']
                    },
                    {
                        name: 'Ed Sheeran - Shape of You',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['ed-sheeran']
                    },
                    {
                        name: 'The Weeknd - Blinding Lights',
                        type: 'video',
                        videoUrl: VIDEO_LIBRARY['weeknd-blinding']
                    }
                ]
            }
        ]
    };

    // ============================================================
    // 3. APPLICATION CODE - Don't change this part
    // ============================================================

    let currentFolder = fileTree;
    let history = [fileTree];

    const treePanel = document.getElementById('tree-panel');
    const pathDisplay = document.getElementById('path-display');

    function renderTree() {
        if (!currentFolder || currentFolder.type !== 'folder') {
            treePanel.innerHTML = '<div class="folder-item">⚠️ Not a folder</div>';
            return;
        }

        pathDisplay.textContent = currentFolder.name;

        let html = '';

        // Go back button
        if (history.length > 1) {
            html += '<div class="folder-item" data-action="back">' +
                        '<span class="icon">⬅️</span> ..' +
                    '</div>';
        }

        // Render children
        for (const child of currentFolder.children) {
            if (child.type === 'folder') {
                html += '<div class="folder-item" data-folder="' + child.name + '">' +
                            '<span class="icon">📁</span> ' + child.name +
                        '</div>';
            } else if (child.type === 'video') {
                html += '<a class="video-item" href="' + child.videoUrl + '" target="_blank">' +
                            '<span class="icon">🔗</span> ' + child.name +
                        '</a>';
            }
        }

        if (currentFolder.children.length === 0) {
            html += '<div class="empty-folder">📭 Empty folder</div>';
        }

        treePanel.innerHTML = html;

        // Event listeners for folders (click to navigate)
        treePanel.querySelectorAll('[data-folder]').forEach(function(el) {
            el.addEventListener('click', function(e) {
                const folderName = this.dataset.folder;
                const folder = currentFolder.children.find(function(c) {
                    return c.name === folderName && c.type === 'folder';
                });
                if (folder) {
                    history.push(currentFolder);
                    currentFolder = folder;
                    renderTree();
                }
            });
        });

        // Back button
        const backBtn = treePanel.querySelector('[data-action="back"]');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                if (history.length > 1) {
                    currentFolder = history.pop();
                    renderTree();
                }
            });
        }
    }

    // Initialize the app
    renderTree();
</script>

</body>
</html>
