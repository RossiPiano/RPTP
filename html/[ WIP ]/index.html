<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Skill Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #e1e1e1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 1400px;
            max-width: 100%;
            background: linear-gradient(145deg, #14141f, #1a1a2e);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a4a;
            display: flex;
            gap: 30px;
            min-height: 700px;
            position: relative;
        }

        .skill-tree-container {
            flex: 1;
            min-width: 0;
        }

        .video-panel {
            width: 380px;
            background: #0a0a12;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            max-height: 700px;
        }

        .video-panel .panel-header {
            font-size: 16px;
            font-weight: 600;
            color: #f7d94e;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
            text-align: center;
        }

        .video-panel .panel-header .skill-name {
            color: #e1e1e1;
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .video-list::-webkit-scrollbar {
            width: 4px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .video-item-btn {
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 12px 16px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .video-item-btn:hover {
            background: #2a2a4a;
            border-color: #4a9eff;
            transform: translateX(4px);
        }

        .video-item-btn .video-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-btn .video-title {
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-item-btn .video-channel {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .video-item-btn .video-duration {
            font-size: 11px;
            color: #555;
            background: #0a0a12;
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .video-item-btn .play-icon {
            color: #4a9eff;
            font-size: 18px;
            flex-shrink: 0;
        }

        .no-videos {
            color: #555;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }

        .no-videos .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #f7d94e, #f0a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header .stats {
            display: flex;
            gap: 20px;
            background: #0a0a12;
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .header .stats span {
            color: #8888aa;
            font-size: 13px;
        }

        .header .stats .value {
            color: #f7d94e;
            font-weight: 700;
            font-size: 16px;
        }

        .reset-btn {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            color: #ff6b6b;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #3a1a1a;
            border-color: #ff6b6b;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0a0a12;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .profile-section label {
            color: #8888aa;
            font-size: 13px;
        }

        .profile-section input {
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            color: #e1e1e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            width: 150px;
        }

        .profile-section input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .profile-btn {
            background: #1a2a4a;
            border: 1px solid #4a9eff;
            color: #6ab0ff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .profile-btn:hover {
            background: #2a3a5a;
        }

        .profile-btn.save {
            background: #1a3a1a;
            border-color: #4a9e4a;
            color: #6aff6a;
        }

        .profile-btn.save:hover {
            background: #2a4a2a;
        }

        .profile-btn.delete {
            background: #3a1a1a;
            border-color: #ff4a4a;
            color: #ff6a6a;
        }

        .profile-btn.delete:hover {
            background: #4a2a2a;
        }

        .profile-status {
            color: #8888aa;
            font-size: 12px;
            margin-left: 5px;
        }

        .profile-status.success {
            color: #6aff6a;
        }

        .profile-status.error {
            color: #ff6a6a;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(145deg, #1a1a2e, #222244);
            border-radius: 20px;
            padding: 30px;
            width: 500px;
            max-width: 95%;
            max-height: 80vh;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a4a;
        }

        .modal-header h2 {
            color: #f7d94e;
            font-size: 22px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0 8px;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .profile-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0a0a12;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #2a2a4a;
            transition: all 0.2s;
        }

        .profile-list-item:hover {
            border-color: #4a9eff;
            background: #1a1a30;
        }

        .profile-list-item .profile-info {
            flex: 1;
        }

        .profile-list-item .profile-name {
            font-weight: 600;
            color: #eee;
            font-size: 15px;
        }

        .profile-list-item .profile-details {
            font-size: 12px;
            color: #8888aa;
            margin-top: 2px;
        }

        .profile-list-item .profile-actions {
            display: flex;
            gap: 8px;
        }

        .profile-list-item .profile-actions button {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .profile-list-item .profile-actions .load-btn {
            background: #1a2a4a;
            border-color: #4a9eff;
            color: #6ab0ff;
        }

        .profile-list-item .profile-actions .load-btn:hover {
            background: #2a3a5a;
        }

        .profile-list-item .profile-actions .delete-btn {
            background: #2a1a1a;
            border-color: #5a2a2a;
            color: #ff6b6b;
        }

        .profile-list-item .profile-actions .delete-btn:hover {
            background: #3a1a1a;
            border-color: #ff6b6b;
        }

        .profile-list-empty {
            text-align: center;
            color: #555;
            padding: 40px 20px;
        }

        .profile-list-empty .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-footer input {
            flex: 1;
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            color: #e1e1e1;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 120px;
        }

        .modal-footer input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .modal-footer .create-btn {
            background: #1a3a1a;
            border: 1px solid #4a9e4a;
            color: #6aff6a;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .modal-footer .create-btn:hover {
            background: #2a4a2a;
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 5px 0;
            max-height: 470px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .skill-tree::-webkit-scrollbar {
            width: 4px;
        }
        .skill-tree::-webkit-scrollbar-track {
            background: transparent;
        }
        .skill-tree::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            position: relative;
        }

        .skill-node {
            background: linear-gradient(145deg, #1a1a30, #222244);
            border: 2px solid #2a2a5a;
            border-radius: 14px;
            padding: 14px 16px;
            width: 160px;
            min-height: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .skill-node:hover {
            transform: translateY(-4px);
            border-color: #f7d94e;
            box-shadow: 0 8px 30px rgba(247, 217, 78, 0.15);
        }

        .skill-node.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .skill-node.locked:hover {
            transform: none;
            border-color: #2a2a5a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .skill-node.unlocked {
            border-color: #4a9eff;
            background: linear-gradient(145deg, #1a2a4a, #1a2a5a);
        }

        .skill-node.unlocked:hover {
            border-color: #6ab0ff;
        }

        .skill-node.mastered {
            border-color: #f7d94e;
            background: linear-gradient(145deg, #2a2a1a, #3a2a1a);
            box-shadow: 0 0 30px rgba(247, 217, 78, 0.1);
        }

        .skill-node.mastered:hover {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(247, 217, 78, 0.2);
        }

        .skill-node.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.2);
        }

        .skill-node .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .skill-node .name {
            font-size: 12px;
            font-weight: 600;
            color: #eee;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .skill-node .description {
            font-size: 10px;
            color: #8888aa;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .skill-node .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.locked {
            background: #2a2a3a;
            color: #666;
        }

        .status-badge.unlocked {
            background: #1a4a7a;
            color: #6ab0ff;
        }

        .status-badge.mastered {
            background: #7a6a1a;
            color: #f7d94e;
        }

        .skill-node .cost {
            font-size: 10px;
            color: #8888aa;
            margin-top: 4px;
        }

        .skill-node .cost span {
            color: #f7d94e;
            font-weight: 700;
        }

        .skill-node .video-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4a9eff;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid #1a1a2e;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #2a2a4a;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8888aa;
        }

        .legend-item .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid;
        }

        .dot.locked {
            background: #1a1a30;
            border-color: #2a2a5a;
        }
        .dot.unlocked {
            background: #1a4a7a;
            border-color: #4a9eff;
        }
        .dot.mastered {
            background: #7a6a1a;
            border-color: #f7d94e;
        }

        @media (max-width: 1024px) {
            .app {
                flex-direction: column;
                padding: 20px;
            }
            .video-panel {
                width: 100%;
                max-height: 400px;
            }
            .skill-node {
                width: 140px;
                min-height: 110px;
                padding: 12px;
            }
            .skill-tree {
                max-height: 350px;
            }
            .modal {
                width: 95%;
                padding: 20px;
            }
        }

        @media (max-width: 600px) {
            .app {
                padding: 12px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header .stats {
                font-size: 12px;
                padding: 6px 12px;
                gap: 12px;
            }
            .skill-node {
                width: 100%;
                min-height: 90px;
            }
            .skill-row {
                flex-direction: column;
                align-items: center;
            }
            .video-panel {
                max-height: 350px;
            }
            .video-item-btn {
                padding: 10px 12px;
            }
            .video-item-btn .video-title {
                font-size: 12px;
            }
            .profile-section input {
                width: 100px;
            }
            .header-top {
                flex-direction: column;
                align-items: stretch;
            }
            .modal-footer {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="skill-tree-container">
        <div class="header">
            <div class="header-top">
                <h1>🎹 Piano Skill Tree</h1>
                <div class="stats">
                    <span>⭐ Points: <span class="value" id="skill-points">0</span></span>
                    <span>🔓 Unlocked: <span class="value" id="unlocked-count">0</span>/<span id="total-skills">0</span></span>
                </div>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <div class="profile-section">
                    <label>👤 Student:</label>
                    <input type="text" id="student-name" placeholder="Enter name" value="Guest">
                    <button class="profile-btn" onclick="openProfileManager()">📂 Profiles</button>
                    <button class="profile-btn save" onclick="saveCurrentProfile()">💾 Save</button>
                    <button class="profile-btn delete" onclick="deleteCurrentProfile()">🗑️ Delete</button>
                    <span class="profile-status" id="profile-status"></span>
                </div>
                <button class="reset-btn" onclick="resetSkills()">⟳ Reset</button>
            </div>
        </div>

        <div class="skill-tree" id="skill-tree"></div>

        <div class="legend">
            <div class="legend-item"><span class="dot locked"></span> Locked</div>
            <div class="legend-item"><span class="dot unlocked"></span> Unlocked</div>
            <div class="legend-item"><span class="dot mastered"></span> Mastered</div>
            <div class="legend-item" style="color:#8888aa;">💡 Click a skill to see tutorials</div>
        </div>
    </div>

    <div class="video-panel" id="video-panel">
        <div class="panel-header">📺 <span class="skill-name" id="panel-skill-name">Select a Skill</span></div>
        <div class="video-list" id="video-list">
            <div class="no-videos">
                <span class="big-icon">🎵</span>
                Click a skill on the left<br>to see YouTube tutorials
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="profile-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>📂 Profile Manager</h2>
            <button class="modal-close" onclick="closeProfileManager()">✕</button>
        </div>
        <div class="modal-body" id="profile-list"></div>
        <div class="modal-footer">
            <input type="text" id="new-profile-name" placeholder="New student name...">
            <button class="create-btn" onclick="createNewProfile()">➕ Create Profile</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. SKILL DATA (12 essential piano skills)
    // ============================================================
    const skillData = {
        'posture': {
            id: 'posture', name: 'Proper Posture', icon: '🧍',
            description: 'Correct sitting position at the piano',
            cost: 1, prerequisites: [], tier: 1,
            videos: [{ title: 'Piano Posture Guide', channel: 'Piano Lessons', duration: '8:23', url: 'https://www.youtube.com/watch?v=qz0aGYrrlhU' }]
        },
        'finger-numbers': {
            id: 'finger-numbers', name: 'Finger Numbers', icon: '✋',
            description: 'Learn which finger is 1-5 on each hand',
            cost: 1, prerequisites: [], tier: 1,
            videos: [{ title: 'Piano Finger Numbers', channel: 'Piano Lessons', duration: '6:32', url: 'https://www.youtube.com/watch?v=rfscVS0vtbw' }]
        },
        'key-names': {
            id: 'key-names', name: 'Key Names', icon: '🎵',
            description: 'Identify all 12 keys on the piano',
            cost: 1, prerequisites: [], tier: 1,
            videos: [{ title: 'Piano Keys Explained', channel: 'Music Theory', duration: '10:15', url: 'https://www.youtube.com/watch?v=6EJ5VfIOfyQ' }]
        },
        'rhythm-basics': {
            id: 'rhythm-basics', name: 'Rhythm Basics', icon: '🥁',
            description: 'Understanding quarter, half, and whole notes',
            cost: 1, prerequisites: [], tier: 1,
            videos: [{ title: 'Piano Rhythm Basics', channel: 'Music Theory', duration: '10:22', url: 'https://www.youtube.com/watch?v=hdI2bqOjy3c' }]
        },
        'hand-position': {
            id: 'hand-position', name: 'Hand Position', icon: '🖐️',
            description: 'Proper curved hand shape for playing',
            cost: 1, prerequisites: ['posture'], tier: 2,
            videos: [{ title: 'Correct Piano Hand Position', channel: 'Piano Lessons', duration: '9:20', url: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' }]
        },
        'c-major-scale': {
            id: 'c-major-scale', name: 'C Major Scale', icon: '🎶',
            description: 'Play the C major scale with correct fingering',
            cost: 2, prerequisites: ['hand-position', 'finger-numbers'], tier: 2,
            videos: [{ title: 'C Major Scale Tutorial', channel: 'Piano Lessons', duration: '11:30', url: 'https://www.youtube.com/watch?v=PkZNo7MFNFg' }]
        },
        'simple-chords': {
            id: 'simple-chords', name: 'Basic Chords', icon: '🎹',
            description: 'Play major and minor triads',
            cost: 2, prerequisites: ['key-names', 'hand-position'], tier: 2,
            videos: [{ title: 'Piano Chords for Beginners', channel: 'Piano Lessons', duration: '15:42', url: 'https://www.youtube.com/watch?v=QBH6IpRkVDs' }]
        },
        'pentatonic-scale': {
            id: 'pentatonic-scale', name: 'Pentatonic Scale', icon: '🎵',
            description: 'Learn the 5-note pentatonic scale',
            cost: 2, prerequisites: ['c-major-scale'], tier: 3,
            videos: [{ title: 'Pentatonic Scale on Piano', channel: 'Piano Lessons', duration: '13:45', url: 'https://www.youtube.com/watch?v=YQHsXMglC9A' }]
        },
        'chord-progressions': {
            id: 'chord-progressions', name: 'Chord Progressions', icon: '🎼',
            description: 'Play I-IV-V-I and other common progressions',
            cost: 2, prerequisites: ['simple-chords'], tier: 3,
            videos: [{ title: 'Chord Progressions Explained', channel: 'Piano Lessons', duration: '14:30', url: 'https://www.youtube.com/watch?v=CevxZvSJLk8' }]
        },
        'two-hand-playing': {
            id: 'two-hand-playing', name: 'Two-Hand Playing', icon: '🤲',
            description: 'Coordinate both hands independently',
            cost: 2, prerequisites: ['c-major-scale', 'simple-chords'], tier: 3,
            videos: [{ title: 'Two Hand Coordination', channel: 'Piano Lessons', duration: '15:40', url: 'https://www.youtube.com/watch?v=E8vH0r7jC9A' }]
        },
        'sight-reading': {
            id: 'sight-reading', name: 'Sight Reading', icon: '📖',
            description: 'Read and play sheet music in real time',
            cost: 3, prerequisites: ['key-names', 'rhythm-basics'], tier: 3,
            videos: [{ title: 'Sight Reading for Piano', channel: 'Music Theory', duration: '16:20', url: 'https://www.youtube.com/watch?v=lC6nI-8n7mE' }]
        },
        'piano-mastery': {
            id: 'piano-mastery', name: '🎯 Piano Mastery', icon: '👑',
            description: 'Achieve the highest level of piano proficiency',
            cost: 5, prerequisites: ['sight-reading', 'two-hand-playing', 'chord-progressions'], tier: 4,
            videos: [{ title: 'Piano Mastery Techniques', channel: 'Piano Lessons', duration: '22:10', url: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' }]
        }
    };

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let skillPoints = 5;
    let unlockedSkills = new Set();
    let masteredSkills = new Set();
    let selectedSkillId = null;
    let currentStudent = 'Guest';

    // ============================================================
    // 3. UI FUNCTIONS
    // ============================================================
    function showStatus(message, type) {
        const statusEl = document.getElementById('profile-status');
        statusEl.textContent = message;
        statusEl.className = 'profile-status ' + (type || '');
        setTimeout(() => {
            statusEl.textContent = '';
            statusEl.className = 'profile-status';
        }, 4000);
    }

    function openProfileManager() {
        document.getElementById('profile-modal').classList.add('active');
        refreshProfilesList();
    }

    function closeProfileManager() {
        document.getElementById('profile-modal').classList.remove('active');
    }

    // ============================================================
    // 4. PROFILE MANAGEMENT (localStorage fallback + server sync)
    // ============================================================
    function getProfileData() {
        return {
            studentName: currentStudent,
            skillPoints: skillPoints,
            unlockedSkills: Array.from(unlockedSkills),
            masteredSkills: Array.from(masteredSkills)
        };
    }

    function applyProfileData(data) {
        if (data.skillPoints !== undefined) skillPoints = data.skillPoints;
        if (data.unlockedSkills) unlockedSkills = new Set(data.unlockedSkills);
        if (data.masteredSkills) masteredSkills = new Set(data.masteredSkills);
        if (data.studentName) {
            currentStudent = data.studentName;
            document.getElementById('student-name').value = currentStudent;
        }
        renderSkillTree();
        updateStats();
        showSkillVideos(selectedSkillId);
    }

    function saveToLocalStorage(data) {
        let savedProfiles = JSON.parse(localStorage.getItem('pianoProfiles') || '[]');
        const index = savedProfiles.findIndex(p => p.name === data.studentName);
        if (index >= 0) {
            savedProfiles[index] = data;
        } else {
            savedProfiles.push(data);
        }
        localStorage.setItem('pianoProfiles', JSON.stringify(savedProfiles));
    }

    // Server API calls
    async function callAPI(action, data = null, query = '') {
        try {
            let url = 'profile_handler.php?action=' + action;
            if (query) url += '&' + query;

            let options = {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            };

            if (data) {
                options.method = 'POST';
                options.body = JSON.stringify(data);
            }

            const response = await fetch(url, options);
            const result = await response.json();
            return result;
        } catch (error) {
            console.error('API Error:', error);
            return { success: false, error: error.message };
        }
    }

    async function saveProfileToServer() {
        const studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            showStatus('Please enter a student name!', 'error');
            return false;
        }
        currentStudent = studentName;

        const data = getProfileData();

        // Save to localStorage as backup
        saveToLocalStorage(data);

        // Try to save to server
        const result = await callAPI('save', data);
        if (result.success) {
            showStatus('✅ Profile "' + currentStudent + '" saved to server!', 'success');
            refreshProfilesList();
            return true;
        } else {
            // If server fails, at least it's in localStorage
            showStatus('⚠️ Saved locally only. Server error: ' + (result.error || 'unknown'), 'error');
            refreshProfilesList();
            return false;
        }
    }

    async function loadProfileFromServer(studentName) {
        const result = await callAPI('load', null, 'name=' + encodeURIComponent(studentName));
        if (result.success && result.data) {
            applyProfileData(result.data);
            showStatus('✅ Profile "' + studentName + '" loaded from server!', 'success');
            closeProfileManager();
            return true;
        } else {
            // Try loading from localStorage as fallback
            const savedProfiles = JSON.parse(localStorage.getItem('pianoProfiles') || '[]');
            const localProfile = savedProfiles.find(p => p.name === studentName);
            if (localProfile) {
                applyProfileData(localProfile);
                showStatus('✅ Profile "' + studentName + '" loaded from local storage.', 'success');
                closeProfileManager();
                return true;
            }
            showStatus('❌ Error loading: ' + (result.error || 'Profile not found'), 'error');
            return false;
        }
    }

    async function listProfilesFromServer() {
        const result = await callAPI('list');
        if (result.success) {
            return result.profiles || [];
        } else {
            // Fallback to localStorage
            const savedProfiles = JSON.parse(localStorage.getItem('pianoProfiles') || '[]');
            return savedProfiles;
        }
    }

    async function deleteProfileFromServer(studentName) {
        if (!confirm('Delete profile "' + studentName + '"?')) return false;

        // Delete from server
        const result = await callAPI('delete', null, 'name=' + encodeURIComponent(studentName));

        // Also remove from localStorage
        let savedProfiles = JSON.parse(localStorage.getItem('pianoProfiles') || '[]');
        savedProfiles = savedProfiles.filter(p => p.name !== studentName);
        localStorage.setItem('pianoProfiles', JSON.stringify(savedProfiles));

        if (result.success) {
            showStatus('🗑️ Profile "' + studentName + '" deleted', 'error');
            refreshProfilesList();
            return true;
        } else {
            showStatus('⚠️ Removed from local storage only.', 'error');
            refreshProfilesList();
            return false;
        }
    }

    // ============================================================
    // 5. PROFILE MANAGER UI
    // ============================================================
    async function refreshProfilesList() {
        const listEl = document.getElementById('profile-list');
        const profiles = await listProfilesFromServer();

        if (!profiles || profiles.length === 0) {
            listEl.innerHTML = `
                <div class="profile-list-empty">
                    <span class="big-icon">📂</span>
                    No profiles found.<br>
                    Create a new profile or save your current progress!
                </div>
            `;
            return;
        }

        let html = '';
        for (const profile of profiles) {
            const isActive = profile.name === currentStudent;
            html += `
                <div class="profile-list-item" style="${isActive ? 'border-color: #f7d94e;' : ''}">
                    <div class="profile-info">
                        <div class="profile-name">${isActive ? '⭐ ' : ''}${profile.name}</div>
                        <div class="profile-details">
                            ⭐ ${profile.skillPoints || 0} pts •
                            🔓 ${(profile.unlockedSkills || []).length} unlocked •
                            ⭐ ${(profile.masteredSkills || []).length} mastered
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button class="load-btn" onclick="loadProfile('${profile.name}')">📂 Load</button>
                        <button class="delete-btn" onclick="deleteProfile('${profile.name}')">🗑️</button>
                    </div>
                </div>
            `;
        }
        listEl.innerHTML = html;
    }

    // Wrapper functions for UI buttons
    async function saveCurrentProfile() {
        await saveProfileToServer();
    }

    async function loadProfile(studentName) {
        await loadProfileFromServer(studentName);
    }

    async function deleteProfile(studentName) {
        await deleteProfileFromServer(studentName);
    }

    async function deleteCurrentProfile() {
        const studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            showStatus('Please enter a student name!', 'error');
            return;
        }
        await deleteProfileFromServer(studentName);
    }

    async function createNewProfile() {
        const nameInput = document.getElementById('new-profile-name');
        const name = nameInput.value.trim();
        if (!name) {
            alert('Please enter a student name!');
            return;
        }

        // Check if profile exists
        const profiles = await listProfilesFromServer();
        if (profiles.some(p => p.name === name)) {
            alert('Profile "' + name + '" already exists!');
            return;
        }

        // Create new profile
        currentStudent = name;
        document.getElementById('student-name').value = name;
        skillPoints = 5;
        unlockedSkills = new Set();
        masteredSkills = new Set();

        // Save to server
        await saveProfileToServer();
        renderSkillTree();
        updateStats();
        showStatus('✅ Profile "' + name + '" created!', 'success');
        refreshProfilesList();
        nameInput.value = '';
        closeProfileManager();
    }

    // Auto-save function
    function autoSave() {
        if (currentStudent && currentStudent !== 'Guest') {
            saveProfileToServer();
        }
    }

    // ============================================================
    // 6. SKILL TREE FUNCTIONS
    // ============================================================
    function getSkillStatus(skillId) {
        if (masteredSkills.has(skillId)) return 'mastered';
        if (unlockedSkills.has(skillId)) return 'unlocked';
        return 'locked';
    }

    function isSkillAvailable(skill) {
        if (unlockedSkills.has(skill.id) || masteredSkills.has(skill.id)) return true;
        if (skill.prerequisites.length === 0) return true;
        return skill.prerequisites.every(prereqId => masteredSkills.has(prereqId));
    }

    function unlockSkill(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        if (unlockedSkills.has(skillId) || masteredSkills.has(skillId)) return;
        if (!isSkillAvailable(skill)) {
            alert('⚠️ You need to master the prerequisites first!');
            return;
        }
        if (skillPoints < skill.cost) {
            alert('⚠️ Not enough skill points! You need ' + skill.cost + ' points.');
            return;
        }
        skillPoints -= skill.cost;
        unlockedSkills.add(skillId);
        renderSkillTree();
        updateStats();
        autoSave();
    }

    function masterSkill(skillId) {
        if (!unlockedSkills.has(skillId)) return;
        if (masteredSkills.has(skillId)) return;
        masteredSkills.add(skillId);
        unlockedSkills.delete(skillId);
        skillPoints += 1;
        renderSkillTree();
        updateStats();
        autoSave();
    }

    function resetSkills() {
        if (confirm('Reset all progress for "' + currentStudent + '"?')) {
            skillPoints = 0;
            unlockedSkills = new Set();
            masteredSkills = new Set();
            selectedSkillId = null;
            renderSkillTree();
            updateStats();
            showSkillVideos(null);
            showStatus('🔄 Progress reset', 'success');
            autoSave();
        }
    }

    function selectSkill(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        if (!unlockedSkills.has(skillId) && !masteredSkills.has(skillId)) {
            alert('🔒 Unlock or master this skill first to access the tutorials!');
            return;
        }
        selectedSkillId = skillId;
        showSkillVideos(skillId);
        renderSkillTree();
    }

    function showSkillVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');
        if (!skillId || !skillData[skillId]) {
            panelName.textContent = 'Select a Skill';
            videoList.innerHTML = `<div class="no-videos"><span class="big-icon">🎵</span>Click a skill on the left<br>to see YouTube tutorials</div>`;
            return;
        }
        const skill = skillData[skillId];
        panelName.textContent = skill.icon + ' ' + skill.name;
        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `<div class="no-videos"><span class="big-icon">📺</span>No tutorials available yet<br>for this skill</div>`;
            return;
        }
        let html = '';
        for (const video of skill.videos) {
            html += `<a href="${video.url}" target="_blank" class="video-item-btn">
                        <span class="video-icon">🎬</span>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-channel">${video.channel}</div>
                        </div>
                        <span class="video-duration">${video.duration}</span>
                        <span class="play-icon">▶</span>
                    </a>`;
        }
        videoList.innerHTML = html;
    }

    function handleSkillClick(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        const status = getSkillStatus(skillId);
        if (status === 'locked') {
            if (isSkillAvailable(skill)) {
                unlockSkill(skillId);
            } else {
                alert('⚠️ You need to master the prerequisites first!\n\nRequired: ' + skill.prerequisites.map(id => skillData[id].name).join(', '));
            }
        } else if (status === 'unlocked') {
            masterSkill(skillId);
            setTimeout(() => selectSkill(skillId), 100);
        } else if (status === 'mastered') {
            selectSkill(skillId);
        }
    }

    function renderSkillTree() {
        const container = document.getElementById('skill-tree');
        const tiers = {};
        for (const [id, skill] of Object.entries(skillData)) {
            const tier = skill.tier || 1;
            if (!tiers[tier]) tiers[tier] = [];
            tiers[tier].push(skill);
        }
        const sortedTiers = Object.keys(tiers).sort((a, b) => a - b);
        let html = '';
        for (const tier of sortedTiers) {
            html += '<div class="skill-row">';
            const skills = tiers[tier].sort((a, b) => a.name.localeCompare(b.name));
            for (const skill of skills) {
                const status = getSkillStatus(skill.id);
                const cost = skill.cost;
                const isSelected = selectedSkillId === skill.id;
                const hasVideos = skill.videos && skill.videos.length > 0;
                const videoCount = hasVideos ? skill.videos.length : 0;
                let statusText = '🔒 Locked';
                let statusClass = 'locked';
                if (status === 'unlocked') { statusText = '🔓 Unlocked'; statusClass = 'unlocked'; }
                else if (status === 'mastered') { statusText = '⭐ Mastered'; statusClass = 'mastered'; }
                const selectedClass = isSelected ? ' active' : '';
                html += `<div class="skill-node ${statusClass}${selectedClass}" onclick="handleSkillClick('${skill.id}')" title="${skill.description}">
                            ${videoCount > 0 ? `<span class="video-badge">📺 ${videoCount}</span>` : ''}
                            <span class="icon">${skill.icon}</span>
                            <div class="name">${skill.name}</div>
                            <div class="description">${skill.description}</div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <div class="cost">💰 Cost: <span>${cost}</span> pts</div>
                        </div>`;
            }
            html += '</div>';
        }
        container.innerHTML = html;
    }

    function updateStats() {
        document.getElementById('skill-points').textContent = skillPoints;
        document.getElementById('unlocked-count').textContent = masteredSkills.size + unlockedSkills.size;
        document.getElementById('total-skills').textContent = Object.keys(skillData).length;
    }

    // ============================================================
    // 7. INITIALIZE
    // ============================================================
    async function init() {
        try {
            // Try to load profiles from server
            const profiles = await listProfilesFromServer();
            if (profiles && profiles.length > 0) {
                const firstProfile = profiles[0];
                currentStudent = firstProfile.name;
                document.getElementById('student-name').value = currentStudent;
                skillPoints = firstProfile.skillPoints || 0;
                unlockedSkills = new Set(firstProfile.unlockedSkills || []);
                masteredSkills = new Set(firstProfile.masteredSkills || []);
            } else {
                // Default starting points
                skillPoints = 5;
            }
        } catch (e) {
            console.log('Using default settings');
            skillPoints = 5;
        }

        renderSkillTree();
        updateStats();
        showSkillVideos(null);

        // Modal close on outside click
        document.getElementById('profile-modal').addEventListener('click', function(e) {
            if (e.target === this) closeProfileManager();
        });

        // Enter key for new profile
        document.getElementById('new-profile-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') createNewProfile();
        });

        console.log('🎹 Piano Skill Tree loaded!');
        console.log('📁 Profiles will be saved to /profiles/ folder on server.');
        console.log('💡 LocalStorage is used as fallback if server is unavailable.');
    }

    // Start the app
    init();
</script>
