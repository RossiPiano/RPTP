<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>💙 Faber Piano Adventures - Primer</title>
    <style>
        /* ============================================================
           🎨 COLOR PALETTE - CUSTOMIZE HERE
           ============================================================
           Light Pastel Blue - Different colors for buttons and frames
        ============================================================ */

        /* ----- BACKGROUNDS ----- */
        :root {
            --bg-body: #1a2a38;           /* Dark blue background */
            --bg-card: #1e3445;            /* Slightly lighter card */
            --bg-item: #2a4a5a;            /* Skill item background (darker blue) */
            --bg-item-hover: #3a5a6a;      /* Skill item hover */
            --bg-video: #1e3445;           /* Video panel background (matches card) */
            --bg-input: #2a4a5a;           /* Input field */
            --bg-banner: #4a7a90;          /* Banner background (lighter blue) */
            --bg-star: #1a2a38;            /* Star background */

            /* ----- BORDERS ----- */
            --border-main: #4a6a7a;         /* Main borders */
            --border-light: #5a7a8a;        /* Lighter borders */
            --border-hover: #7aa8c0;        /* Border on hover */
            --border-active: #7ab8d8;       /* Border on active/selected */

            /* ----- TEXT ----- */
            --text-primary: #d0e8f0;        /* Main text - light blue-white */
            --text-secondary: #90b0c0;      /* Secondary text */
            --text-light: #607a8a;          /* Light text */
            --text-banner: #e0f0f8;         /* Banner text */
            --text-star: #4a6a7a;           /* Star off color */

            /* ----- ACCENTS ----- */
            --accent-blue: #7ab8d8;          /* Primary pastel blue */
            --accent-blue-dark: #5a9ab8;     /* Darker blue */
            --accent-gold: #d4c050;          /* Star gold */
            --accent-glow: rgba(90, 154, 184, 0.25);

            /* ----- MISC ----- */
            --shadow-color: rgba(0, 0, 0, 0.4);
            --radius-main: 24px;
            --radius-small: 12px;
        }

        /* ============================================================
           END OF COLOR PALETTE - STYLES BELOW
        ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            overflow-x: hidden;
        }

        /* ===== PASSWORD SCREEN ===== */
        .login-screen {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border-radius: var(--radius-main);
            padding: 40px 30px;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 2px solid var(--border-main);
            text-align: center;
        }

        .login-screen h1 {
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-screen .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-screen .lock-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .login-screen input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 12px;
        }

        .login-screen input:focus {
            border-color: var(--accent-blue);
        }

        .login-screen input::placeholder {
            color: var(--text-light);
        }

        .login-screen .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            border: none;
            border-radius: var(--radius-small);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-screen .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .login-screen .login-btn:active {
            transform: scale(0.98);
        }

        .login-screen .error-msg {
            color: #d48a7a;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }

        .login-screen .hint {
            color: var(--text-light);
            font-size: 11px;
            margin-top: 16px;
        }

        /* ===== MAIN APP ===== */
        .app {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-card);
            border-radius: var(--radius-main);
            padding: 16px;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 2px solid var(--border-main);
            display: none;
            flex-direction: column;
            gap: 10px;
            max-height: 98vh;
            min-height: 98vh;
            overflow: hidden;
        }

        .app.visible {
            display: flex;
        }

        /* ===== STICKY HEADER ===== */
        .sticky-header {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-card);
            border-radius: 0;
            margin: -16px -16px 0 -16px;
            padding: 16px 16px 4px 16px;
        }

        .sticky-header .test-banner {
            background: var(--bg-banner);
            color: var(--text-banner);
            padding: 4px 14px;
            text-align: center;
            font-size: 12px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            margin-bottom: 8px;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }

        .sticky-header .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }

        .sticky-header .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .sticky-header .header .stats {
            display: flex;
            gap: 10px;
            background: var(--bg-item);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-light);
            font-size: 12px;
            align-items: center;
            color: var(--text-secondary);
        }

        .sticky-header .header .stats span {
            color: var(--text-secondary);
        }

        .sticky-header .header .stats .value {
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 14px;
        }

        .sticky-header .reset-btn {
            background: var(--bg-item);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .sticky-header .reset-btn:hover {
            background: var(--bg-item-hover);
            border-color: var(--border-hover);
        }

        .sticky-header .reset-btn:active {
            transform: scale(0.95);
        }

        /* ===== HORIZONTAL LINE ===== */
        .header-divider {
            flex-shrink: 0;
            height: 2px;
            background: var(--border-main);
            margin: 4px 0 0 0;
            position: relative;
            z-index: 5;
        }

        /* ===== STICKY LEGEND ===== */
        .sticky-legend {
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            z-index: 20;
            background: var(--bg-card);
            padding: 6px 0 0 0;
            margin: 0 -16px -16px -16px;
            padding: 6px 16px 16px 16px;
            border-radius: 0 0 var(--radius-main) var(--radius-main);
        }

        .sticky-legend .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 2px solid var(--border-main);
            flex-shrink: 0;
        }

        .sticky-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            color: var(--text-secondary);
        }

        .sticky-legend .legend-item .star-legend {
            font-size: 12px;
        }

        .sticky-legend .legend-item .star-legend.on {
            color: var(--accent-gold);
        }

        .sticky-legend .legend-item .star-legend.off {
            color: var(--text-star);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            display: flex;
            gap: 14px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding-top: 4px;
        }

        /* LEFT COLUMN - Skill List (scrollable) */
        .skill-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .skill-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 4px 8px 2px;
            -webkit-overflow-scrolling: touch;
        }

        .skill-list::-webkit-scrollbar {
            width: 4px;
        }
        .skill-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .skill-list::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        /* RIGHT COLUMN - Video Panel */
        .video-column {
            width: 340px;
            flex-shrink: 0;
            background: var(--bg-video);
            border-radius: 16px;
            border: 2px solid var(--border-main);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 4px;
            align-self: flex-start;
            height: 78px;
            max-height: 78px;
            min-height: 78px;
            overflow: hidden;
            margin-top: 0;
            z-index: 10;
        }

        .video-column .panel-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-main);
            flex-shrink: 0;
            min-height: 18px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            z-index: 1;
        }

        .video-column .panel-header .skill-name {
            color: var(--text-primary);
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }

        .video-list::-webkit-scrollbar {
            width: 3px;
        }
        .video-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: var(--border-main);
            border-radius: 4px;
        }

        /* ===== VIDEO ITEM ===== */
        .video-item-btn {
            background: var(--bg-item);
            border: 2px solid var(--border-light);
            border-radius: 8px;
            padding: 4px 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            flex-shrink: 0;
            height: 30px;
        }

        .video-item-btn:active {
            transform: scale(0.98);
            background: var(--bg-item-hover);
            border-color: var(--border-hover);
        }

        .video-item-btn .video-icon {
            font-size: 10px;
            flex-shrink: 0;
            color: var(--accent-blue);
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .video-item-btn .video-title {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .video-item-btn .video-channel {
            font-size: 7px;
            color: var(--text-secondary);
            line-height: 1.2;
        }

        .video-item-btn .video-duration {
            font-size: 7px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            height: 16px;
            display: flex;
            align-items: center;
        }

        .video-item-btn .play-icon {
            color: var(--accent-blue);
            font-size: 10px;
            flex-shrink: 0;
        }

        .no-videos-placeholder {
            color: var(--text-light);
            font-size: 10px;
            text-align: center;
            padding: 4px 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== SKILL ITEM ===== */
        .skill-item {
            background: var(--bg-item);
            border: 2px solid var(--border-main);
            border-radius: var(--radius-small);
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .skill-item:active {
            transform: scale(0.98);
        }

        .skill-item:hover {
            border-color: var(--border-hover);
            transform: translateX(4px);
        }

        .skill-item.active {
            border-color: var(--border-active);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .skill-item .left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .skill-item .icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .skill-item .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
        }

        .skill-item .book-ref {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 4px;
        }

        .skill-item .right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ===== STAR CYCLER ===== */
        .star-cycler {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            background: var(--bg-star);
            border-radius: 30px;
            padding: 2px 12px;
            border: 1px solid var(--border-light);
            min-width: 66px;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            height: 28px;
        }

        .star-cycler:hover {
            border-color: var(--border-hover);
            background: var(--bg-item-hover);
            transform: scale(1.02);
        }

        .star-cycler:active {
            transform: scale(0.95);
        }

        .star-cycler .star-display {
            font-size: 16px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .star-cycler .star-display .on {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 192, 80, 0.2);
        }

        .star-cycler .star-display .off {
            color: var(--text-star);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 820px) {
            .app {
                padding: 10px;
                gap: 6px;
                max-height: 98vh;
                min-height: 98vh;
            }

            .sticky-header {
                padding: 10px 10px 4px 10px;
                margin: -10px -10px 0 -10px;
            }

            .header-divider {
                margin: 2px 0 0 0;
            }

            .sticky-legend {
                padding: 4px 10px 10px 10px;
                margin: 0 -10px -10px -10px;
            }

            .main-content {
                flex-direction: column;
                gap: 8px;
                padding-top: 4px;
            }

            .video-column {
                width: 100%;
                flex-shrink: 0;
                order: -1;
                padding: 8px 10px;
                position: sticky;
                top: 4px;
                z-index: 10;
                background: var(--bg-video);
                border: 2px solid var(--border-main);
                border-radius: 16px;
                height: 72px;
                max-height: 72px;
                min-height: 72px;
                margin-top: 0;
            }

            .video-column .panel-header {
                font-size: 11px;
                margin-bottom: 3px;
                padding-bottom: 3px;
                min-height: 16px;
            }

            .video-item-btn {
                font-size: 9px;
                padding: 3px 8px;
                height: 26px;
            }

            .video-item-btn .video-title {
                font-size: 9px;
            }

            .video-item-btn .video-channel {
                font-size: 7px;
            }

            .video-item-btn .video-duration {
                font-size: 7px;
                padding: 1px 4px;
                height: 14px;
            }

            .skill-item {
                padding: 5px 10px;
                min-height: 32px;
            }

            .skill-item .icon {
                font-size: 16px;
                width: 24px;
            }

            .skill-item .name {
                font-size: 12px;
            }

            .skill-item .book-ref {
                font-size: 8px;
            }

            .star-cycler {
                min-width: 56px;
                padding: 1px 10px;
                height: 24px;
            }

            .star-cycler .star-display {
                font-size: 14px;
            }

            .skill-list {
                gap: 3px;
                padding: 2px 2px 4px 2px;
            }

            .sticky-header .header h1 {
                font-size: 17px;
            }

            .sticky-header .header .stats {
                font-size: 10px;
                padding: 3px 12px;
            }

            .sticky-header .header .stats .value {
                font-size: 12px;
            }

            .sticky-header .test-banner {
                font-size: 10px;
                padding: 3px 12px;
            }

            .sticky-legend .legend {
                gap: 8px;
                padding-top: 4px;
            }

            .sticky-legend .legend-item {
                font-size: 8px;
            }

            .login-screen {
                padding: 30px 20px;
            }

            .login-screen h1 {
                font-size: 20px;
            }

            .no-videos-placeholder {
                font-size: 9px;
                padding: 2px 0;
            }
        }

        @media (max-width: 380px) {
            .app {
                padding: 6px;
                gap: 4px;
                max-height: 98vh;
                min-height: 98vh;
            }

            .sticky-header {
                padding: 6px 6px 3px 6px;
                margin: -6px -6px 0 -6px;
            }

            .header-divider {
                margin: 2px 0 0 0;
            }

            .sticky-legend {
                padding: 3px 6px 6px 6px;
                margin: 0 -6px -6px -6px;
            }

            .video-column {
                height: 62px;
                max-height: 62px;
                min-height: 62px;
                padding: 6px 8px;
            }

            .video-column .panel-header {
                font-size: 10px;
                min-height: 14px;
                margin-bottom: 2px;
                padding-bottom: 2px;
            }

            .video-item-btn {
                font-size: 8px;
                padding: 2px 6px;
                height: 22px;
            }

            .video-item-btn .video-title {
                font-size: 8px;
            }

            .skill-item {
                padding: 4px 8px;
                min-height: 28px;
                gap: 6px;
            }

            .skill-item .icon {
                font-size: 14px;
                width: 20px;
            }

            .skill-item .name {
                font-size: 11px;
            }

            .skill-item .book-ref {
                font-size: 7px;
            }

            .star-cycler {
                min-width: 48px;
                padding: 1px 8px;
                height: 20px;
            }

            .star-cycler .star-display {
                font-size: 12px;
            }

            .sticky-header .header h1 {
                font-size: 15px;
            }

            .sticky-header .header .stats {
                font-size: 9px;
                padding: 2px 10px;
            }

            .sticky-header .header .stats .value {
                font-size: 11px;
            }

            .sticky-header .test-banner {
                font-size: 9px;
                padding: 2px 10px;
            }

            .sticky-legend .legend-item {
                font-size: 7px;
            }

            .video-item-btn .video-channel {
                display: none;
            }

            .login-screen {
                padding: 24px 16px;
            }

            .login-screen h1 {
                font-size: 18px;
            }

            .login-screen input {
                font-size: 14px;
                padding: 10px 14px;
            }

            .login-screen .login-btn {
                font-size: 14px;
                padding: 10px;
            }

            .no-videos-placeholder {
                font-size: 8px;
                padding: 2px 0;
            }
        }

        /* Landscape phones */
        @media (max-height: 500px) and (orientation: landscape) {
            .app {
                max-height: 96vh;
                min-height: 96vh;
                padding: 6px;
                gap: 4px;
            }

            .sticky-header {
                padding: 4px 6px 2px 6px;
                margin: -6px -6px 0 -6px;
            }

            .header-divider {
                margin: 2px 0 0 0;
            }

            .sticky-legend {
                padding: 2px 6px 6px 6px;
                margin: 0 -6px -6px -6px;
            }

            .video-column {
                height: 60px;
                max-height: 60px;
                min-height: 60px;
                padding: 4px 8px;
            }

            .video-column .panel-header {
                font-size: 9px;
                margin-bottom: 2px;
                padding-bottom: 2px;
                min-height: 12px;
            }

            .video-item-btn {
                font-size: 7px;
                padding: 2px 6px;
                height: 20px;
            }

            .video-item-btn .video-title {
                font-size: 7px;
            }

            .video-item-btn .video-channel {
                display: none;
            }

            .video-item-btn .video-duration {
                font-size: 6px;
                padding: 1px 3px;
                height: 12px;
            }

            .skill-item {
                padding: 3px 6px;
                min-height: 24px;
                gap: 4px;
            }

    const PASSWORD = 'devpassw0rd';

    function checkPassword() {
        const input = document.getElementById('password-input');
        const error = document.getElementById('login-error');
        const password = input.value.trim();

        if (password === PASSWORD) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').classList.add('visible');
            initApp();
        } else {
            error.textContent = '❌ Incorrect password. Please try again.';
            input.value = '';
            input.focus();
            input.style.borderColor = '#d48a7a';
            setTimeout(() => { input.style.borderColor = ''; }, 500);
        }
    }

    document.getElementById('password-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            checkPassword();

        },

            bookRef: 'p. 59',

            ]
        },
        'parallel-answer': {
            id: 'parallel-answer',
            name: 'Parallel Answer',
            icon: '🔄',
            description: 'Understanding parallel answers in music',
            bookRef: 'p. 63',
            videos: [
                { title: 'Parallel Answers in Music', channel: 'Music Theory', duration: '15:30', url: 'https://www.youtube.com/watch?v=lC6nI-8n7mE' }

            ]
        },
        'tie': {

            icon: '🔗',

            name: 'Damper Pedal',

            ]
        }
    };

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let selectedSkillId = null;
    let skillStars = {};

    for (const id of Object.keys(skillData)) {
        skillStars[id] = 0;
    }

    // ============================================================
    // 3. CORE FUNCTIONS
    // ============================================================
    function handleSkillClick(skillId) {
        selectedSkillId = skillId;
        renderAll();
        showVideos(skillId);
    }

    function cycleStars(skillId, event) {
        event.stopPropagation();
        const current = skillStars[skillId] || 0;
        skillStars[skillId] = (current + 1) % 4;
        renderAll();
        if (selectedSkillId === skillId) {
            showVideos(skillId);
        }
    }

    function resetSkills() {
        if (confirm('Reset all star ratings to 0?')) {
            for (const id of Object.keys(skillData)) {
                skillStars[id] = 0;
            }
            renderAll();
            if (selectedSkillId) {
                showVideos(selectedSkillId);
            }
        }
    }

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================
    function renderList() {
        const container = document.getElementById('skill-list');

        let html = '';
        for (const [id, skill] of Object.entries(skillData)) {
            const isSelected = selectedSkillId === id;
            const selectedClass = isSelected ? ' active' : '';
            const starCount = skillStars[id] || 0;

            let starDisplay = '';
            for (let i = 0; i < 3; i++) {
                const isOn = i < starCount;
                starDisplay += `<span class="${isOn ? 'on' : 'off'}">${isOn ? '⭐' : '☆'}</span>`;
            }

            html += `
                <div class="skill-item${selectedClass}"
                     onclick="handleSkillClick('${id}')"
                     ontouchstart=""
                     title="${skill.description}">
                    <div class="left">
                        <span class="icon">${skill.icon}</span>
                        <span class="name">
                            ${skill.name}
                            <span class="book-ref">${skill.bookRef || ''}</span>
                        </span>
                    </div>
                    <div class="right">
                        <span class="star-cycler" onclick="cycleStars('${id}', event)" title="Click to cycle: 0→1→2→3→0">
                            <span class="star-display">${starDisplay}</span>
                        </span>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function showVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            panelName.textContent = '';
            videoList.innerHTML = `<div class="no-videos-placeholder">💙 Select a skill</div>`;
            return;
        }

        const skill = skillData[skillId];
        const starCount = skillStars[skillId] || 0;
        const levelLabels = ['☆☆☆ Not Started', '★☆☆ Started', '★★☆ Good Progress', '★★★ Mastered'];
        panelName.textContent = skill.icon + ' ' + skill.name + ' — ' + levelLabels[starCount];

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `<div class="no-videos-placeholder">💧 No videos</div>`;
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">▶</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">↗</span>
                </a>
            `;
        }
        videoList.innerHTML = html;
    }

    function updateStats() {
        const totalSkills = Object.keys(skillData).length;
        let videoCount = 0;
        for (const skill of Object.values(skillData)) {
            if (skill.videos) videoCount += skill.videos.length;
        }
        document.getElementById('total-skills').textContent = totalSkills;
        document.getElementById('video-count').textContent = videoCount;
    }

    function renderAll() {
        renderList();
        updateStats();
    }

    // ============================================================
    // 5. APP INITIALIZATION
    // ============================================================
    let appInitialized = false;

    function initApp() {
        if (appInitialized) return;
        appInitialized = true;
        renderAll();
        showVideos(null);
        console.log('💙 Faber Piano Adventures - Primer Lesson Book');
        console.log('💡 ' + Object.keys(skillData).length + ' skills available');
        console.log('🎥 ' + Object.values(skillData).reduce((sum, s) => sum + (s.videos ? s.videos.length : 0), 0) + ' video tutorials');
        console.log('⭐ Click the star area to cycle: 0→1→2→3→0');
        console.log('🎨 Different colors for buttons and frames');
    }
</script>
