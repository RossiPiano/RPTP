<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Style Piano Skill Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #e1e1e1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            background: linear-gradient(145deg, #0d0d1a, #14142a);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 90vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #f7d94e, #f0a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header .stats {
            display: flex;
            gap: 15px;
            background: #0a0a12;
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .header .stats span {
            color: #8888aa;
        }

        .header .stats .value {
            color: #f7d94e;
            font-weight: 700;
            font-size: 15px;
        }

        .reset-btn {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            color: #ff6b6b;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #3a1a1a;
            border-color: #ff6b6b;
        }

        /* Main content - side by side (ALWAYS) */
        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .tree-wrapper {
            flex: 1;
            overflow: auto;
            padding: 10px;
            background: radial-gradient(ellipse at center, #0d0d20, #080812);
            border-radius: 12px;
            border: 1px solid #1a1a3a;
            min-height: 500px;
            position: relative;
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 15px;
            min-width: fit-content;
            position: relative;
        }

        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connections-svg line {
            stroke: #2a2a5a;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .connections-svg line.active {
            stroke: #4a9eff;
            stroke-width: 4;
        }

        .connections-svg line.mastered {
            stroke: #f7d94e;
            stroke-width: 4;
            filter: drop-shadow(0 0 6px rgba(247, 217, 78, 0.3));
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .skill-node {
            background: radial-gradient(ellipse at 30% 30%, #1a1a35, #0d0d20);
            border: 2px solid #2a2a5a;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            padding: 4px;
        }

        .skill-node:hover {
            transform: scale(1.12);
            border-color: #f7d94e;
            box-shadow: 0 0 30px rgba(247, 217, 78, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 10;
        }

        .skill-node .icon {
            font-size: 18px;
            line-height: 1;
            margin-bottom: 1px;
        }

        .skill-node .name {
            font-size: 7px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1.1;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .skill-node .cost-badge {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background: #1a1a3a;
            border: 1px solid #4a4a7a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 8px;
            font-weight: 700;
            color: #8888aa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skill-node .video-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4a9eff;
            border: 1px solid #4a9eff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 8px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skill-node .status-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            font-weight: 700;
            white-space: nowrap;
            color: #555;
        }

        .skill-node.locked {
            opacity: 0.6;
            filter: grayscale(0.5);
            cursor: pointer;
        }

        .skill-node.locked:hover {
            transform: scale(1.05);
            border-color: #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.1);
        }

        .skill-node.unlocked {
            border-color: #4a9eff;
            background: radial-gradient(ellipse at 30% 30%, #1a2a5a, #0d1a2a);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.15), inset 0 1px 0 rgba(74, 158, 255, 0.1);
        }

        .skill-node.unlocked .name {
            color: #6ab0ff;
        }

        .skill-node.mastered {
            border-color: #f7d94e;
            background: radial-gradient(ellipse at 30% 30%, #2a2a1a, #1a1a0d);
            box-shadow: 0 0 30px rgba(247, 217, 78, 0.15), inset 0 1px 0 rgba(247, 217, 78, 0.1);
            animation: pulse-mastered 2s ease-in-out infinite;
        }

        .skill-node.mastered .name {
            color: #f7d94e;
        }

        .skill-node.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.2);
        }

        @keyframes pulse-mastered {
            0%, 100% { box-shadow: 0 0 20px rgba(247, 217, 78, 0.1); }
            50% { box-shadow: 0 0 40px rgba(247, 217, 78, 0.25); }
        }

        /* Video Panel - Right Side (ALWAYS) */
        .video-panel {
            width: 380px;
            flex-shrink: 0;
            background: #0a0a12;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 600px;
            overflow: hidden;
        }

        .video-panel .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: #f7d94e;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a4a;
        }

        .video-panel .panel-header .skill-name {
            color: #e1e1e1;
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .video-list::-webkit-scrollbar {
            width: 4px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .video-item-btn {
            background: #1a2a4a;
            border: 1px solid #4a9eff;
            border-radius: 8px;
            padding: 8px 14px;
            color: #6ab0ff;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-item-btn:hover {
            background: #2a3a5a;
            border-color: #6ab0ff;
            transform: translateX(4px);
        }

        .video-item-btn .video-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-btn .video-title {
            font-weight: 500;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-item-btn .video-channel {
            font-size: 10px;
            color: #8888aa;
            margin-top: 1px;
        }

        .video-item-btn .video-duration {
            font-size: 10px;
            color: #8888aa;
            background: #0a0a12;
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .video-item-btn .play-icon {
            color: #4a9eff;
            font-size: 16px;
            flex-shrink: 0;
        }

        .no-videos {
            color: #555;
            font-size: 13px;
            padding: 20px 0;
            text-align: center;
        }

        .no-videos .big-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .hint-text {
            color: #444;
            font-size: 10px;
            text-align: center;
            padding-top: 8px;
            border-top: 1px solid #1a1a2a;
            margin-top: 8px;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px solid #2a2a4a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #8888aa;
        }

        .legend-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid;
        }

        .dot.locked { background: #1a1a30; border-color: #2a2a5a; }
        .dot.unlocked { background: #1a4a7a; border-color: #4a9eff; }
        .dot.mastered { background: #7a6a1a; border-color: #f7d94e; }

        /* ============================================================
           RESPONSIVE - Video panel stays on right, nodes shrink
           ============================================================ */

        /* Medium screens: Smaller video panel, smaller nodes */
        @media (max-width: 1024px) {
            .video-panel {
                width: 280px;
                max-height: 500px;
            }
            .skill-node {
                width: 60px;
                height: 60px;
            }
            .skill-node .icon {
                font-size: 16px;
            }
            .skill-node .name {
                font-size: 6px;
                max-width: 50px;
            }
            .skill-node .cost-badge {
                width: 18px;
                height: 18px;
                font-size: 7px;
                bottom: -5px;
                right: -5px;
            }
            .skill-node .video-badge {
                width: 16px;
                height: 16px;
                font-size: 7px;
                top: -5px;
                right: -5px;
            }
            .skill-row {
                gap: 16px;
            }
            .video-item-btn {
                font-size: 11px;
                padding: 6px 10px;
            }
        }

        /* Small screens: Even smaller, but still side-by-side */
        @media (max-width: 768px) {
            .app {
                padding: 10px;
                gap: 10px;
                min-height: 95vh;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .stats {
                font-size: 11px;
                padding: 4px 10px;
                gap: 10px;
            }
            .main-content {
                gap: 10px;
            }
            .video-panel {
                width: 200px;
                max-height: 400px;
                padding: 10px;
            }
            .video-panel .panel-header {
                font-size: 12px;
                margin-bottom: 8px;
                padding-bottom: 6px;
            }
            .video-item-btn {
                font-size: 10px;
                padding: 4px 8px;
                gap: 6px;
            }
            .video-item-btn .video-icon {
                font-size: 12px;
            }
            .video-item-btn .video-duration {
                font-size: 8px;
                padding: 1px 4px;
            }
            .video-item-btn .video-title {
                font-size: 10px;
            }
            .video-item-btn .video-channel {
                font-size: 8px;
            }
            .skill-node {
                width: 50px;
                height: 50px;
            }
            .skill-node .icon {
                font-size: 14px;
            }
            .skill-node .name {
                font-size: 5px;
                max-width: 40px;
            }
            .skill-node .cost-badge {
                width: 14px;
                height: 14px;
                font-size: 6px;
                bottom: -4px;
                right: -4px;
            }
            .skill-node .video-badge {
                width: 12px;
                height: 12px;
                font-size: 6px;
                top: -4px;
                right: -4px;
            }
            .skill-node .status-label {
                font-size: 6px;
                bottom: -16px;
            }
            .skill-row {
                gap: 12px;
            }
            .legend-item {
                font-size: 8px;
            }
            .legend-item .dot {
                width: 8px;
                height: 8px;
            }
            .no-videos {
                font-size: 11px;
                padding: 10px 0;
            }
            .no-videos .big-icon {
                font-size: 24px;
            }
            .hint-text {
                font-size: 8px;
                padding-top: 4px;
                margin-top: 4px;
            }
            .tree-wrapper {
                min-height: 300px;
            }
        }

        /* Very small screens: Keep side-by-side, tiny nodes */
        @media (max-width: 500px) {
            .app {
                padding: 6px;
                gap: 6px;
            }
            .video-panel {
                width: 140px;
                max-height: 300px;
                padding: 6px;
            }
            .video-panel .panel-header {
                font-size: 10px;
                margin-bottom: 4px;
                padding-bottom: 4px;
            }
            .video-item-btn {
                font-size: 8px;
                padding: 3px 6px;
                gap: 4px;
                border-radius: 4px;
            }
            .video-item-btn .video-icon {
                font-size: 10px;
            }
            .video-item-btn .video-duration {
                font-size: 7px;
                padding: 1px 3px;
            }
            .video-item-btn .video-title {
                font-size: 8px;
            }
            .video-item-btn .video-channel {
                font-size: 7px;
            }
            .video-item-btn .play-icon {
                font-size: 10px;
            }
            .skill-node {
                width: 40px;
                height: 40px;
                padding: 2px;
            }
            .skill-node .icon {
                font-size: 12px;
            }
            .skill-node .name {
                font-size: 4px;
                max-width: 30px;
            }
            .skill-node .cost-badge {
                width: 12px;
                height: 12px;
                font-size: 5px;
                bottom: -3px;
                right: -3px;
            }
            .skill-node .video-badge {
                width: 10px;
                height: 10px;
                font-size: 5px;
                top: -3px;
                right: -3px;
            }
            .skill-node .status-label {
                font-size: 5px;
                bottom: -14px;
            }
            .skill-row {
                gap: 8px;
            }
            .header h1 {
                font-size: 14px;
            }
            .header .stats {
                font-size: 9px;
                padding: 3px 8px;
                gap: 6px;
            }
            .header .stats .value {
                font-size: 11px;
            }
            .reset-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .tree-wrapper {
                padding: 4px;
                min-height: 200px;
            }
            .skill-tree {
                padding: 8px;
                gap: 8px;
            }
            .legend {
                gap: 8px;
                padding-top: 4px;
            }
            .legend-item {
                font-size: 7px;
                gap: 3px;
            }
            .legend-item .dot {
                width: 6px;
                height: 6px;
            }
            .no-videos {
                font-size: 9px;
                padding: 6px 0;
            }
            .no-videos .big-icon {
                font-size: 18px;
            }
            .hint-text {
                font-size: 7px;
                padding-top: 3px;
                margin-top: 3px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <h1>⚡ Piano Skill Web</h1>
        <div class="stats">
            <span>⭐ <span class="value" id="skill-points">0</span></span>
            <span>🔓 <span class="value" id="unlocked-count">0</span>/<span id="total-skills">0</span></span>
            <button class="reset-btn" onclick="resetSkills()">⟳ Reset</button>
        </div>
    </div>

    <!-- Main Content: Tree + Video Panel (ALWAYS side by side) -->
    <div class="main-content">
        <!-- Skill Tree -->
        <div class="tree-wrapper">
            <div class="skill-tree" id="skill-tree">
                <svg class="connections-svg" id="connections-svg"></svg>
            </div>
        </div>

        <!-- Video Panel - Right Side (ALWAYS) -->
        <div class="video-panel" id="video-panel">
            <div class="panel-header">
                📺 <span class="skill-name" id="panel-skill-name">Select a Skill</span>
            </div>
            <div class="video-list" id="video-list">
                <div class="no-videos">
                    <span class="big-icon">🎵</span>
                    Click a skill node<br>to see YouTube tutorials
                </div>
            </div>
            <div class="hint-text">💡 Unlock or master a skill first, then click it</div>
        </div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item"><span class="dot locked"></span> Locked</div>
        <div class="legend-item"><span class="dot unlocked"></span> Unlocked</div>
        <div class="legend-item"><span class="dot mastered"></span> Mastered</div>
        <div class="legend-item" style="color:#555;">🎥 Click mastered/unlocked for YouTube links</div>
    </div>
</div>

            cost: 2, prerequisites: ['c-major-scale', 'simple-chords'], tier: 3,
            videos: [
                { title: 'Two Hand Coordination', channel: 'Piano Lessons', duration: '15:40', url: 'https://www.youtube.com/watch?v=E8vH0r7jC9A' }
            ]
        },
        'sight-reading': {
            id: 'sight-reading', name: 'Sight Read', icon: '📖',
            description: 'Read sheet music in real time',
            cost: 3, prerequisites: ['key-names', 'rhythm-basics'], tier: 3,
            videos: [
                { title: 'Sight Reading for Piano', channel: 'Music Theory', duration: '16:20', url: 'https://www.youtube.com/watch?v=lC6nI-8n7mE' }
            ]
        },
        'piano-mastery': {
            id: 'piano-mastery', name: '🌟 Mastery', icon: '👑',
            description: 'Highest piano proficiency',
            cost: 5, prerequisites: ['sight-reading', 'two-hand-playing', 'chord-progressions'], tier: 4,
            videos: [
                { title: 'Piano Mastery Techniques', channel: 'Piano Lessons', duration: '22:10', url: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' }
            ]
        }
    };

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let skillPoints = 5;
    let unlockedSkills = new Set();
    let masteredSkills = new Set();
    let selectedSkillId = null;

    // ============================================================
    // 3. CORE FUNCTIONS
    // ============================================================
    function getSkillStatus(skillId) {
        if (masteredSkills.has(skillId)) return 'mastered';
        if (unlockedSkills.has(skillId)) return 'unlocked';
        return 'locked';
    }

    function isSkillAvailable(skill) {
        if (unlockedSkills.has(skill.id) || masteredSkills.has(skill.id)) return true;
        if (skill.prerequisites.length === 0) return true;
        return skill.prerequisites.every(prereqId => masteredSkills.has(prereqId));
    }

    function handleSkillClick(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        const status = getSkillStatus(skillId);

        if (status === 'locked') {
            if (!isSkillAvailable(skill)) {
                const prereqs = skill.prerequisites.map(id => skillData[id].name).join(', ');
                alert('⚠️ You need to master: ' + prereqs);
                return;
            }
            if (skillPoints < skill.cost) {
                alert('⚠️ Not enough points! Need ' + skill.cost + ' points.');
                return;
            }
            skillPoints -= skill.cost;
            unlockedSkills.add(skillId);
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);

        } else if (status === 'unlocked') {
            masteredSkills.add(skillId);
            unlockedSkills.delete(skillId);
            skillPoints += 1;
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);

        } else if (status === 'mastered') {
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);
        }
    }

    function resetSkills() {
        if (confirm('Reset all progress?')) {
            skillPoints = 5;
            unlockedSkills = new Set();
            masteredSkills = new Set();
            selectedSkillId = null;
            renderAll();
            showVideos(null);
        }
    }

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================
    function renderTree() {
        const container = document.getElementById('skill-tree');
        const svg = document.getElementById('connections-svg');

        const tiers = {};
        for (const [id, skill] of Object.entries(skillData)) {
            const tier = skill.tier || 1;
            if (!tiers[tier]) tiers[tier] = [];
            tiers[tier].push(skill);
        }

        const sortedTiers = Object.keys(tiers).sort((a, b) => a - b);

        let html = '';
        for (const tier of sortedTiers) {
            html += '<div class="skill-row">';
            const skills = tiers[tier].sort((a, b) => a.name.localeCompare(b.name));
            for (const skill of skills) {
                const status = getSkillStatus(skill.id);
                const isSelected = selectedSkillId === skill.id;
                const hasVideos = skill.videos && skill.videos.length > 0;
                const videoCount = hasVideos ? skill.videos.length : 0;

                let statusClass = 'locked';
                let statusLabel = '🔒';
                if (status === 'unlocked') { statusClass = 'unlocked'; statusLabel = '🔓'; }
                else if (status === 'mastered') { statusClass = 'mastered'; statusLabel = '⭐'; }

                const selectedClass = isSelected ? ' active' : '';

                html += `
                    <div class="skill-node ${statusClass}${selectedClass}"
                         onclick="handleSkillClick('${skill.id}')"
                         title="${skill.description}">
                        ${videoCount > 0 ? `<span class="video-badge">▶</span>` : ''}
                        <span class="icon">${skill.icon}</span>
                        <span class="name">${skill.name}</span>
                        <span class="cost-badge">${skill.cost}</span>
                        <span class="status-label">${statusLabel}</span>
                    </div>
                `;
            }
            html += '</div>';
        }
        container.innerHTML = html;

        setTimeout(drawConnections, 50);
    }

    function drawConnections() {
        const svg = document.getElementById('connections-svg');
        const container = document.getElementById('skill-tree');

        svg.setAttribute('width', container.scrollWidth || 800);
        svg.setAttribute('height', container.scrollHeight || 600);

        let svgContent = '';

        const nodes = document.querySelectorAll('.skill-node');
        const positions = {};

        nodes.forEach(node => {
            const onclick = node.getAttribute('onclick');
            const match = onclick.match(/'([^']+)'/);
            if (match) {
                const skillId = match[1];
                const rect2 = node.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                positions[skillId] = {
                    x: rect2.left - containerRect.left + rect2.width / 2,
                    y: rect2.top - containerRect.top + rect2.height / 2
                };
            }
        });

        for (const [id, skill] of Object.entries(skillData)) {
            for (const prereqId of skill.prerequisites) {
                if (positions[id] && positions[prereqId]) {
                    const from = positions[prereqId];
                    const to = positions[id];

                    const prereqStatus = getSkillStatus(prereqId);
                    const skillStatus = getSkillStatus(id);
                    let lineClass = '';

                    if (prereqStatus === 'mastered' && skillStatus !== 'locked') {
                        lineClass = 'mastered';
                    } else if (prereqStatus === 'unlocked' || prereqStatus === 'mastered') {
                        lineClass = 'active';
                    }

                    svgContent += `
                        <line x1="${from.x}" y1="${from.y}"
                              x2="${to.x}" y2="${to.y}"
                              class="${lineClass}" />
                    `;
                }
            }
        }

        svg.innerHTML = svgContent;
    }

    function showVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            panelName.textContent = 'Select a Skill';
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">🎵</span>
                    Click a skill node<br>to see YouTube tutorials
                </div>
            `;
            return;
        }

        const skill = skillData[skillId];
        const status = getSkillStatus(skillId);

        if (status === 'locked') {
            panelName.textContent = skill.icon + ' ' + skill.name + ' 🔒';
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">🔒</span>
                    Unlock or master this skill first<br>to see tutorials
                </div>
            `;
            return;
        }

        const statusEmoji = status === 'mastered' ? '⭐' : '🔓';
        panelName.textContent = skill.icon + ' ' + skill.name + ' ' + statusEmoji;

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">📺</span>
                    No tutorials available<br>for this skill
                </div>
            `;
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">▶</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">↗</span>
                </a>
            `;
        }
        videoList.innerHTML = html;
    }

    function updateStats() {
        document.getElementById('skill-points').textContent = skillPoints;
        document.getElementById('unlocked-count').textContent = masteredSkills.size + unlockedSkills.size;
        document.getElementById('total-skills').textContent = Object.keys(skillData).length;
    }

    function renderAll() {
        renderTree();
        updateStats();
    }

    // ============================================================
    // 5. INITIALIZE
    // ============================================================
    function init() {
        renderAll();
        showVideos(null);
        setTimeout(drawConnections, 200);
        window.addEventListener('resize', () => setTimeout(drawConnections, 300));
        console.log('⚡ PoE Style Piano Skill Tree loaded!');
        console.log('💡 1-click to unlock → 1-click to master → click for YouTube videos');
        console.log('📺 YouTube videos appear on the right panel (always)');
    }

    init();
</script>

</body>
</html>
