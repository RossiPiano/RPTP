<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 PoE Style Piano Skill Tree - TESTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #e1e1e1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 6px;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(145deg, #0d0d1a, #14142a);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 98vh;
        }

        /* TEST VERSION BANNER */
        .test-banner {
            background: #ff6b6b;
            color: #fff;
            padding: 4px 10px;
            text-align: center;
            font-size: 10px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        /* Header - Compact for phone */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: clamp(14px, 4vw, 20px);
            background: linear-gradient(135deg, #f7d94e, #f0a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header .stats {
            display: flex;
            gap: clamp(6px, 1.5vw, 12px);
            background: #0a0a12;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            font-size: clamp(9px, 2.5vw, 13px);
            align-items: center;
        }

        .header .stats span {
            color: #8888aa;
        }

        .header .stats .value {
            color: #f7d94e;
            font-weight: 700;
            font-size: clamp(11px, 2.8vw, 15px);
        }

        .reset-btn {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            color: #ff6b6b;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: clamp(9px, 2.2vw, 12px);
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .reset-btn:active {
            background: #3a1a1a;
        }

        /* Main content - Vertical for phone */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        /* Tree Wrapper - Takes most of the space */
        .tree-wrapper {
            flex: 1;
            overflow: auto;
            padding: clamp(4px, 1.5vw, 10px);
            background: radial-gradient(ellipse at center, #0d0d20, #080812);
            border-radius: 12px;
            border: 1px solid #1a1a3a;
            min-height: clamp(200px, 50vh, 500px);
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 2vw, 14px);
            padding: clamp(6px, 2vw, 15px);
            min-width: fit-content;
            position: relative;
        }

        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connections-svg line {
            stroke: #2a2a5a;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .connections-svg line.active {
            stroke: #4a9eff;
            stroke-width: 3;
        }

        .connections-svg line.mastered {
            stroke: #f7d94e;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px rgba(247, 217, 78, 0.3));
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2.5vw, 18px);
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        /* Skill Nodes - Dynamically sized */
        .skill-node {
            background: radial-gradient(ellipse at 30% 30%, #1a1a35, #0d0d20);
            border: 2px solid #2a2a5a;
            border-radius: 50%;
            width: clamp(42px, 12vw, 70px);
            height: clamp(42px, 12vw, 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            padding: 3px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .skill-node:active {
            transform: scale(0.92);
        }

        .skill-node .icon {
            font-size: clamp(12px, 3.5vw, 20px);
            line-height: 1;
            margin-bottom: 1px;
        }

        .skill-node .name {
            font-size: clamp(4.5px, 1.3vw, 8px);
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1.1;
            max-width: clamp(30px, 10vw, 60px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .skill-node .cost-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #1a1a3a;
            border: 1px solid #4a4a7a;
            border-radius: 50%;
            width: clamp(14px, 4vw, 22px);
            height: clamp(14px, 4vw, 22px);
            font-size: clamp(5px, 1.5vw, 9px);
            font-weight: 700;
            color: #8888aa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skill-node .video-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #4a9eff;
            border: 1px solid #4a9eff;
            border-radius: 50%;
            width: clamp(12px, 3.5vw, 18px);
            height: clamp(12px, 3.5vw, 18px);
            font-size: clamp(5px, 1.5vw, 8px);
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skill-node .status-label {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(5px, 1.2vw, 7px);
            font-weight: 700;
            white-space: nowrap;
            color: #555;
        }

        .skill-node.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
            cursor: pointer;
        }

        .skill-node.locked:active {
            transform: scale(0.92);
        }

        .skill-node.unlocked {
            border-color: #4a9eff;
            background: radial-gradient(ellipse at 30% 30%, #1a2a5a, #0d1a2a);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.15), inset 0 1px 0 rgba(74, 158, 255, 0.1);
        }

        .skill-node.unlocked .name {
            color: #6ab0ff;
        }

        .skill-node.mastered {
            border-color: #f7d94e;
            background: radial-gradient(ellipse at 30% 30%, #2a2a1a, #1a1a0d);
            box-shadow: 0 0 20px rgba(247, 217, 78, 0.15), inset 0 1px 0 rgba(247, 217, 78, 0.1);
            animation: pulse-mastered 2s ease-in-out infinite;
        }

        .skill-node.mastered .name {
            color: #f7d94e;
        }

        .skill-node.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.2);
        }

        @keyframes pulse-mastered {
            0%, 100% { box-shadow: 0 0 15px rgba(247, 217, 78, 0.1); }
            50% { box-shadow: 0 0 30px rgba(247, 217, 78, 0.2); }
        }

        /* Video Panel - Bottom for phone */
        .video-panel {
            flex-shrink: 0;
            background: #0a0a12;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            padding: clamp(6px, 2vw, 14px);
            max-height: clamp(120px, 25vh, 200px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-panel .panel-header {
            font-size: clamp(10px, 2.5vw, 14px);
            font-weight: 600;
            color: #f7d94e;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .video-panel .panel-header .skill-name {
            color: #e1e1e1;
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 1vw, 8px);
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .video-list::-webkit-scrollbar {
            width: 3px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .video-item-btn {
            background: #1a2a4a;
            border: 1px solid #4a9eff;
            border-radius: 6px;
            padding: clamp(3px, 1vw, 8px) clamp(6px, 2vw, 12px);
            color: #6ab0ff;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            font-size: clamp(8px, 2vw, 12px);
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.5vw, 10px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .video-item-btn:active {
            transform: scale(0.98);
            background: #2a3a5a;
        }

        .video-item-btn .video-icon {
            font-size: clamp(10px, 2.5vw, 16px);
            flex-shrink: 0;
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-btn .video-title {
            font-weight: 500;
            color: #eee;
            font-size: clamp(8px, 2vw, 12px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-item-btn .video-channel {
            font-size: clamp(6px, 1.5vw, 10px);
            color: #8888aa;
            margin-top: 1px;
        }

        .video-item-btn .video-duration {
            font-size: clamp(6px, 1.5vw, 10px);
            color: #8888aa;
            background: #0a0a12;
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .video-item-btn .play-icon {
            color: #4a9eff;
            font-size: clamp(10px, 2.5vw, 16px);
            flex-shrink: 0;
        }

        .no-videos {
            color: #555;
            font-size: clamp(9px, 2vw, 13px);
            padding: clamp(5px, 1.5vw, 15px) 0;
            text-align: center;
        }

        .no-videos .big-icon {
            font-size: clamp(18px, 5vw, 32px);
            display: block;
            margin-bottom: 4px;
        }

        .hint-text {
            color: #444;
            font-size: clamp(7px, 1.5vw, 10px);
            text-align: center;
            padding-top: 4px;
            border-top: 1px solid #1a1a2a;
            margin-top: 4px;
            flex-shrink: 0;
        }

        /* Legend - Compact for phone */
        .legend {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 16px);
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: clamp(7px, 1.8vw, 11px);
            color: #8888aa;
        }

        .legend-item .dot {
            width: clamp(6px, 1.5vw, 10px);
            height: clamp(6px, 1.5vw, 10px);
            border-radius: 50%;
            border: 2px solid;
        }

        .dot.locked { background: #1a1a30; border-color: #2a2a5a; }
        .dot.unlocked { background: #1a4a7a; border-color: #4a9eff; }
        .dot.mastered { background: #7a6a1a; border-color: #f7d94e; }

        /* Hide scrollbar on tree for cleaner look */
        .tree-wrapper::-webkit-scrollbar {
            width: 3px;
        }
        .tree-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .tree-wrapper::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        /* ============================================================
           SPECIFIC PHONE BREAKPOINTS - All vertical
           ============================================================ */

        /* Very small phones (Galaxy A series, iPhone SE) */
        @media (max-width: 380px) {
            .app { padding: 8px; gap: 8px; }
            .skill-row { gap: 6px; }
            .tree-wrapper { min-height: 180px; }
            .video-panel { max-height: 110px; }
            .skill-node { width: 40px; height: 40px; }
            .skill-node .icon { font-size: 12px; }
            .skill-node .name { font-size: 4.5px; max-width: 32px; }
            .skill-node .cost-badge { width: 12px; height: 12px; font-size: 5px; }
            .skill-node .video-badge { width: 10px; height: 10px; font-size: 5px; }
            .skill-node .status-label { font-size: 5px; bottom: -14px; }
            .header h1 { font-size: 13px; }
            .header .stats { font-size: 8px; padding: 2px 8px; }
            .test-banner { font-size: 8px; padding: 3px 8px; }
        }

        /* Small phones (Pixel 4a, iPhone 6/7/8) */
        @media (min-width: 381px) and (max-width: 480px) {
            .app { padding: 10px; gap: 10px; }
            .skill-row { gap: 8px; }
            .tree-wrapper { min-height: 250px; }
            .video-panel { max-height: 140px; }
            .skill-node { width: 48px; height: 48px; }
            .skill-node .icon { font-size: 14px; }
            .skill-node .name { font-size: 5px; max-width: 38px; }
            .skill-node .cost-badge { width: 14px; height: 14px; font-size: 6px; }
            .skill-node .video-badge { width: 12px; height: 12px; font-size: 6px; }
            .skill-node .status-label { font-size: 5px; bottom: -14px; }
        }

        /* Medium phones (Pixel 5/6, iPhone 12/13/14, Galaxy S series) */
        @media (min-width: 481px) and (max-width: 600px) {
            .app { padding: 12px; gap: 12px; }
            .skill-row { gap: 12px; }
            .tree-wrapper { min-height: 320px; }
            .video-panel { max-height: 170px; }
            .skill-node { width: 56px; height: 56px; }
            .skill-node .icon { font-size: 16px; }
            .skill-node .name { font-size: 6px; max-width: 46px; }
            .skill-node .cost-badge { width: 16px; height: 16px; font-size: 7px; }
            .skill-node .video-badge { width: 14px; height: 14px; font-size: 7px; }
        }

        /* Large phones / small tablets (Pixel 7 Pro, iPhone 14 Plus/Pro Max) */
        @media (min-width: 601px) and (max-width: 768px) {
            .app { padding: 14px; gap: 14px; max-width: 550px; }
            .skill-row { gap: 14px; }
            .tree-wrapper { min-height: 380px; }
            .video-panel { max-height: 190px; }
            .skill-node { width: 62px; height: 62px; }
            .skill-node .icon { font-size: 18px; }
            .skill-node .name { font-size: 6.5px; max-width: 52px; }
            .skill-node .cost-badge { width: 18px; height: 18px; font-size: 7px; }
            .skill-node .video-badge { width: 16px; height: 16px; font-size: 7px; }
        }

        /* Landscape phones - still vertical layout but smaller */
        @media (max-height: 600px) and (orientation: landscape) {
            .app { max-width: 100%; padding: 6px; gap: 5px; min-height: 96vh; }
            .tree-wrapper { min-height: 120px; }
            .skill-node { width: 36px; height: 36px; }
            .skill-node .icon { font-size: 10px; }
            .skill-node .name { font-size: 4px; max-width: 28px; }
            .skill-node .cost-badge { width: 10px; height: 10px; font-size: 4px; }
            .skill-node .video-badge { width: 9px; height: 9px; font-size: 4px; }
            .skill-node .status-label { font-size: 4px; bottom: -12px; }
            .skill-row { gap: 4px; }
            .video-panel { max-height: 80px; padding: 4px 8px; }
            .video-item-btn { font-size: 7px; padding: 2px 6px; }
            .video-item-btn .video-title { font-size: 7px; }
            .header h1 { font-size: 12px; }
            .header .stats { font-size: 8px; padding: 2px 6px; }
            .legend { gap: 6px; padding-top: 3px; }
            .legend-item { font-size: 6px; }
            .legend-item .dot { width: 5px; height: 5px; }
            .test-banner { font-size: 7px; padding: 2px 6px; }
            .no-videos { font-size: 8px; padding: 3px 0; }
            .no-videos .big-icon { font-size: 14px; }
            .hint-text { font-size: 6px; padding-top: 2px; margin-top: 2px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- TEST VERSION BANNER -->
    <div class="test-banner">
        📱 PHONE OPTIMIZED - Test Version
    </div>

    <!-- Header -->
    <div class="header">
        <h1>⚡ Piano Skill Web</h1>
        <div class="stats">
            <span>⭐ <span class="value" id="skill-points">0</span></span>
            <span>🔓 <span class="value" id="unlocked-count">0</span>/<span id="total-skills">0</span></span>
            <button class="reset-btn" onclick="resetSkills()">⟳</button>
        </div>
    </div>

    <!-- Main Content: Tree (top) + Video Panel (bottom) -->
    <div class="main-content">
        <!-- Skill Tree -->
        <div class="tree-wrapper">
            <div class="skill-tree" id="skill-tree">
                <svg class="connections-svg" id="connections-svg"></svg>
            </div>
        </div>

        <!-- Video Panel - Bottom for phone -->
        <div class="video-panel" id="video-panel">
            <div class="panel-header">
                📺 <span class="skill-name" id="panel-skill-name">Select a Skill</span>
            </div>
            <div class="video-list" id="video-list">
                <div class="no-videos">
                    <span class="big-icon">🎵</span>
                    Tap a skill node<br>to see YouTube tutorials
                </div>
            </div>
            <div class="hint-text">💡 Unlock or master a skill first, then tap it</div>
        </div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item"><span class="dot locked"></span> Locked</div>
        <div class="legend-item"><span class="dot unlocked"></span> Unlocked</div>
        <div class="legend-item"><span class="dot mastered"></span> Mastered</div>
        <div class="legend-item" style="color:#555;">🎥 Tap for videos</div>
    </div>
</div>

    // ============================================================
    // 1. SKILL DATA
    // ============================================================

        },
        'chord-progressions': {
            id: 'chord-progressions', name: 'Progressions', icon: '🎼',
            description: 'I-IV-V-I and more',
            cost: 2, prerequisites: ['simple-chords'], tier: 3,
            videos: [
                { title: 'Chord Progressions Explained', channel: 'Piano Lessons', duration: '14:30', url: 'https://www.youtube.com/watch?v=CevxZvSJLk8' }
            ]
        },
        'two-hand-playing': {
            id: 'two-hand-playing', name: 'Two Hands', icon: '🤲',
            description: 'Coordinate both hands',
            cost: 2, prerequisites: ['c-major-scale', 'simple-chords'], tier: 3,
            videos: [
                { title: 'Two Hand Coordination', channel: 'Piano Lessons', duration: '15:40', url: 'https://www.youtube.com/watch?v=E8vH0r7jC9A' }
            ]
        },
        'sight-reading': {
            id: 'sight-reading', name: 'Sight Read', icon: '📖',
            description: 'Read sheet music in real time',
            cost: 3, prerequisites: ['key-names', 'rhythm-basics'], tier: 3,
            videos: [
                { title: 'Sight Reading for Piano', channel: 'Music Theory', duration: '16:20', url: 'https://www.youtube.com/watch?v=lC6nI-8n7mE' }
            ]
        },
        'piano-mastery': {
            id: 'piano-mastery', name: '🌟 Mastery', icon: '👑',
            description: 'Highest piano proficiency',
            cost: 5, prerequisites: ['sight-reading', 'two-hand-playing', 'chord-progressions'], tier: 4,
            videos: [
                { title: 'Piano Mastery Techniques', channel: 'Piano Lessons', duration: '22:10', url: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' }
            ]
        }
    };

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let skillPoints = 5;
    let unlockedSkills = new Set();
    let masteredSkills = new Set();
    let selectedSkillId = null;

    // ============================================================
    // 3. CORE FUNCTIONS
    // ============================================================
    function getSkillStatus(skillId) {
        if (masteredSkills.has(skillId)) return 'mastered';
        if (unlockedSkills.has(skillId)) return 'unlocked';
        return 'locked';
    }

    function isSkillAvailable(skill) {
        if (unlockedSkills.has(skill.id) || masteredSkills.has(skill.id)) return true;
        if (skill.prerequisites.length === 0) return true;
        return skill.prerequisites.every(prereqId => masteredSkills.has(prereqId));
    }

    function handleSkillClick(skillId) {
        const skill = skillData[skillId];
        if (!skill) return;
        const status = getSkillStatus(skillId);

        if (status === 'locked') {
            if (!isSkillAvailable(skill)) {
                const prereqs = skill.prerequisites.map(id => skillData[id].name).join(', ');
                alert('⚠️ You need to master: ' + prereqs);
                return;
            }
            if (skillPoints < skill.cost) {
                alert('⚠️ Not enough points! Need ' + skill.cost + ' points.');
                return;
            }
            skillPoints -= skill.cost;
            unlockedSkills.add(skillId);
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);

        } else if (status === 'unlocked') {
            masteredSkills.add(skillId);
            unlockedSkills.delete(skillId);
            skillPoints += 1;
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);

        } else if (status === 'mastered') {
            selectedSkillId = skillId;
            renderAll();
            showVideos(skillId);
        }
    }

    function resetSkills() {
        if (confirm('Reset all progress?')) {
            skillPoints = 5;
            unlockedSkills = new Set();
            masteredSkills = new Set();
            selectedSkillId = null;
            renderAll();
            showVideos(null);
        }
    }

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================
    function renderTree() {
        const container = document.getElementById('skill-tree');
        const svg = document.getElementById('connections-svg');

        const tiers = {};
        for (const [id, skill] of Object.entries(skillData)) {
            const tier = skill.tier || 1;
            if (!tiers[tier]) tiers[tier] = [];
            tiers[tier].push(skill);
        }

        const sortedTiers = Object.keys(tiers).sort((a, b) => a - b);

        let html = '';
        for (const tier of sortedTiers) {
            html += '<div class="skill-row">';
            const skills = tiers[tier].sort((a, b) => a.name.localeCompare(b.name));
            for (const skill of skills) {
                const status = getSkillStatus(skill.id);
                const isSelected = selectedSkillId === skill.id;
                const hasVideos = skill.videos && skill.videos.length > 0;
                const videoCount = hasVideos ? skill.videos.length : 0;

                let statusClass = 'locked';
                let statusLabel = '🔒';
                if (status === 'unlocked') { statusClass = 'unlocked'; statusLabel = '🔓'; }
                else if (status === 'mastered') { statusClass = 'mastered'; statusLabel = '⭐'; }

                const selectedClass = isSelected ? ' active' : '';

                html += `
                    <div class="skill-node ${statusClass}${selectedClass}"
                         onclick="handleSkillClick('${skill.id}')"
                         ontouchstart=""
                         title="${skill.description}">
                        ${videoCount > 0 ? `<span class="video-badge">▶</span>` : ''}
                        <span class="icon">${skill.icon}</span>
                        <span class="name">${skill.name}</span>
                        <span class="cost-badge">${skill.cost}</span>
                        <span class="status-label">${statusLabel}</span>
                    </div>
                `;
            }
            html += '</div>';
        }
        container.innerHTML = html;

        setTimeout(drawConnections, 100);
    }

    function drawConnections() {
        const svg = document.getElementById('connections-svg');
        const container = document.getElementById('skill-tree');

        svg.setAttribute('width', container.scrollWidth || 800);
        svg.setAttribute('height', container.scrollHeight || 600);

        let svgContent = '';

        const nodes = document.querySelectorAll('.skill-node');
        const positions = {};

        nodes.forEach(node => {
            const onclick = node.getAttribute('onclick');
            const match = onclick.match(/'([^']+)'/);
            if (match) {
                const skillId = match[1];
                const rect2 = node.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                positions[skillId] = {
                    x: rect2.left - containerRect.left + rect2.width / 2,
                    y: rect2.top - containerRect.top + rect2.height / 2
                };
            }
        });

        for (const [id, skill] of Object.entries(skillData)) {
            for (const prereqId of skill.prerequisites) {
                if (positions[id] && positions[prereqId]) {
                    const from = positions[prereqId];
                    const to = positions[id];

                    const prereqStatus = getSkillStatus(prereqId);
                    const skillStatus = getSkillStatus(id);
                    let lineClass = '';

                    if (prereqStatus === 'mastered' && skillStatus !== 'locked') {
                        lineClass = 'mastered';
                    } else if (prereqStatus === 'unlocked' || prereqStatus === 'mastered') {
                        lineClass = 'active';
                    }

                    svgContent += `
                        <line x1="${from.x}" y1="${from.y}"
                              x2="${to.x}" y2="${to.y}"
                              class="${lineClass}" />
                    `;
                }
            }
        }

        svg.innerHTML = svgContent;
    }

    function showVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            panelName.textContent = 'Select a Skill';
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">🎵</span>
                    Tap a skill node<br>to see YouTube tutorials
                </div>
            `;
            return;
        }

        const skill = skillData[skillId];
        const status = getSkillStatus(skillId);

        if (status === 'locked') {
            panelName.textContent = skill.icon + ' ' + skill.name + ' 🔒';
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">🔒</span>
                    Unlock or master this skill first<br>to see tutorials
                </div>
            `;
            return;
        }

        const statusEmoji = status === 'mastered' ? '⭐' : '🔓';
        panelName.textContent = skill.icon + ' ' + skill.name + ' ' + statusEmoji;

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `
                <div class="no-videos">
                    <span class="big-icon">📺</span>
                    No tutorials available<br>for this skill
                </div>
            `;
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">▶</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">↗</span>
                </a>
            `;
        }
        videoList.innerHTML = html;
    }

    function updateStats() {
        document.getElementById('skill-points').textContent = skillPoints;
        document.getElementById('unlocked-count').textContent = masteredSkills.size + unlockedSkills.size;
        document.getElementById('total-skills').textContent = Object.keys(skillData).length;
    }

    function renderAll() {
        renderTree();
        updateStats();
    }

    // ============================================================
    // 5. INITIALIZE
    // ============================================================
    function init() {
        renderAll();
        showVideos(null);
        setTimeout(drawConnections, 200);
        window.addEventListener('resize', () => setTimeout(drawConnections, 300));
        console.log('📱 Phone-optimized Piano Skill Tree loaded!');
        console.log('💡 Tap to unlock → Tap to master → Tap for videos');
    }

    init();
</script>

</body>
</html>
