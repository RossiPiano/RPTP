<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📚 Faber Piano Adventures - Primer</title>
    <style>
        /* ============================================================
           🎨 COLOR PALETTE - CUSTOMIZE HERE
           ============================================================ */
        :root {
            --bg-body: #f5f0ea;
            --bg-card: #ffffff;
            --bg-item: #f0ece6;
            --bg-item-hover: #e8e0d8;
            --bg-video: #f5f0ea;
            --bg-banner: #e8f0f5;
            --bg-star: #ffffff;
            --bg-input: #f5f0ea;
            --border-main: #d5d8da;
            --border-light: #e0e4e6;
            --border-hover: #b0c8d8;
            --border-active: #8ab8d0;
            --text-primary: #4a5a6a;
            --text-secondary: #7a8a9a;
            --text-light: #aab8c0;
            --text-banner: #3a5a6a;
            --text-star: #c8c0b8;
            --shadow-color: rgba(180, 170, 160, 0.15);
            --radius-main: 24px;
            --radius-small: 12px;

            /* ============================================================
               🎨 SECTION COLORS - Green / Blue / Red
               ============================================================ */

            /* --- BOOKS SECTION (Green) --- */
            --books-accent: #5a9a6a;
            --books-accent-dark: #3a7a4a;
            --books-accent-light: #e8f5ea;
            --books-accent-glow: rgba(90, 154, 106, 0.2);
            --books-border: #a0c8aa;
            --books-border-hover: #6aaa7a;
            --books-bg-item: #eef5f0;
            --books-bg-item-hover: #dce8e0;
            --books-text: #3a6a4a;

            /* --- SKILLS SECTION (Blue) --- */
            --skills-accent: #6a9ab8;
            --skills-accent-dark: #4a7a98;
            --skills-accent-light: #e8f0f8;
            --skills-accent-glow: rgba(106, 154, 184, 0.2);
            --skills-border: #a0c0d8;
            --skills-border-hover: #6a9ab8;
            --skills-bg-item: #eef3f8;
            --skills-bg-item-hover: #dce8f0;
            --skills-text: #3a6a8a;

            /* --- LEARNING MATERIALS SECTION (Red/YouTube) --- */
            --materials-accent: #cc6a5a;
            --materials-accent-dark: #aa4a3a;
            --materials-accent-light: #f8ecea;
            --materials-accent-glow: rgba(204, 106, 90, 0.2);
            --materials-border: #e0b0a8;
            --materials-border-hover: #cc6a5a;
            --materials-bg-item: #f8f0ee;
            --materials-bg-item-hover: #f0e0dc;
            --materials-text: #8a4a3a;

            /* ============================================================
               🔤 FONT SIZES - ADJUST THESE VALUES
               ============================================================ */
            --font-app-title: 22px;
            --font-section-title: 15px;
            --font-placeholder: 14px;
            --font-video-title: 12px;
            --font-video-channel: 8px;
            --font-video-duration: 8px;
            --font-book-item: 12px;
            --font-item: 12px;
            --font-book-ref: 10px;
            --font-star-label: 16px;
            --font-reset-btn: 13px;

            /* ============================================================
               📐 LAYOUT SIZES - ADJUST THESE VALUES
               ============================================================ */
            --button-height: 36px;           /* Uniform height for all buttons */
            --button-gap: 4px;               /* Gap between buttons */
            --section-min-height: 44px;      /* Minimum height for scrollable areas */

            /* ============================================================
               📏 SCROLLABLE AREA HEIGHT - ADJUST THIS VALUE
               Controls the fixed height of ALL 3 scrollable areas (Books, Skills, Learning Materials)
               Default: 160px (shows about 4 videos/items comfortably)
               ============================================================ */
            --scrollable-area-height: 160px;  /* Fixed height for all scrollable areas */
        }

        /* ============================================================
           END OF SETTINGS - STYLES BELOW
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            overflow-x: hidden;
        }

        /* ===== MAIN APP ===== */
        .app {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-card);
            border-radius: var(--radius-main);
            padding: 16px;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 2px solid var(--border-main);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 98vh;
            min-height: 98vh;
            overflow: hidden;
        }

        /* ===== STICKY HEADER ===== */
        .sticky-header {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-card);
            border-radius: 0;
            margin: -16px -16px 0 -16px;
            padding: 16px 16px 4px 16px;
        }

        .sticky-header .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .sticky-header .header h1 {
            font-size: var(--font-app-title);
            background: linear-gradient(135deg, var(--skills-accent), var(--skills-accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* ===== HORIZONTAL LINE ===== */
        .header-divider {
            flex-shrink: 0;
            height: 2px;
            background: var(--border-main);
            margin: 2px 0 0 0;
            position: relative;
            z-index: 5;
        }

        /* ============================================================
           MAIN CONTENT - VERTICAL LAYOUT (ALL SECTIONS STACKED)
           ============================================================ */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding-top: 4px;
        }

        /* ============================================================
           ALL 3 SECTIONS - SAME WIDTH & HEIGHT
           ============================================================ */
        .books-column,
        .skill-column,
        .video-column {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: var(--scrollable-area-height);
            max-height: var(--scrollable-area-height);
            min-height: var(--section-min-height);
            overflow: hidden;
            border-radius: var(--radius-small);
            padding: 4px;
        }

        /* ============================================================
           BOOKS FRAME - GREEN THEME (TOP)
           ============================================================ */
        .books-column {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 200, 0, 0.3);
            margin-top: 0;
        }

        .books-column .column-label {
            font-size: var(--font-section-title);
            font-weight: 600;
            color: var(--books-accent-dark);
            margin-bottom: 4px;
            padding-left: 4px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 0, 0.1);
        }

        .books-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--button-gap);
            padding: 2px 0px;
            min-height: 0;
            background: rgba(0, 255, 0, 0.05);
        }

        .books-list::-webkit-scrollbar {
            width: 4px;
        }
        .books-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .books-list::-webkit-scrollbar-thumb {
            background: var(--books-border);
            border-radius: 4px;
        }

        .book-item {
            background: var(--books-bg-item);
            border: 2px solid var(--books-border);
            border-radius: var(--radius-small);
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: var(--button-height);
            min-height: var(--button-height);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--font-book-item);
            font-weight: 600;
            color: var(--books-text);
            flex-shrink: 0;
            border-color: rgba(0, 200, 0, 0.5);
            background: rgba(0, 200, 0, 0.08);
        }

        .book-item:hover {
            border-color: var(--books-border-hover);
            transform: translateX(4px);
            background: var(--books-bg-item-hover);
        }

        .book-item:active {
            transform: scale(0.98);
        }

        .book-item .icon {
            font-size: calc(var(--font-book-item) + 4px);
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .book-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           SKILLS FRAME - BLUE THEME (MIDDLE)
           ============================================================ */
        .skill-column {
            background: rgba(0, 0, 255, 0.03);
            border: 1px solid rgba(0, 100, 255, 0.2);
            padding-top: 4px;
        }

        .skill-column .column-label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding-left: 4px;
            flex-shrink: 0;
            background: rgba(0, 255, 255, 0.05);
        }

        .skill-column .column-label {
            font-size: var(--font-section-title);
            font-weight: 600;
            color: var(--skills-accent-dark);
            letter-spacing: 0.5px;
        }

        .skill-column .reset-btn-small {
            background: var(--skills-bg-item);
            border: 1px solid var(--skills-border);
            color: var(--skills-text);
            padding: 2px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: var(--font-reset-btn);
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
            line-height: 1.4;
            height: var(--button-height);
        }

        .skill-column .reset-btn-small:hover {
            background: var(--skills-bg-item-hover);
            border-color: var(--skills-border-hover);
        }

        .skill-column .reset-btn-small:active {
            transform: scale(0.95);
        }

        .skill-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--button-gap);
            padding: 2px 0px;
            min-height: 0;
            background: rgba(0, 100, 255, 0.03);
        }

        .skill-list::-webkit-scrollbar {
            width: 4px;
        }
        .skill-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .skill-list::-webkit-scrollbar-thumb {
            background: var(--skills-border);
            border-radius: 4px;
        }

        /* ============================================================
           SKILL ITEM - BLUE THEME
           ============================================================ */
        .skill-item {
            background: var(--skills-bg-item);
            border: 2px solid var(--skills-border);
            border-radius: var(--radius-small);
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            height: var(--button-height);
            min-height: var(--button-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-color: rgba(0, 100, 255, 0.4);
            background: rgba(0, 100, 255, 0.06);
        }

        .skill-item:active {
            transform: scale(0.98);
        }

        .skill-item:hover {
            border-color: var(--skills-border-hover);
            transform: translateX(4px);
            background: var(--skills-bg-item-hover);
        }

        .skill-item.active {
            border-color: var(--skills-accent);
            box-shadow: 0 0 20px var(--skills-accent-glow);
            background: var(--skills-accent-light);
        }

        .skill-item .left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .skill-item .icon {
            font-size: calc(var(--font-item) + 4px);
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .skill-item .name {
            font-size: var(--font-item);
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
        }

        .skill-item .book-ref {
            font-size: var(--font-book-ref);
            color: var(--skills-text);
            font-weight: 400;
            margin-left: 4px;
        }

        .skill-item .right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ============================================================
           LEARNING MATERIALS FRAME - RED/YOUTUBE THEME (BOTTOM)
           ============================================================ */
        .video-column {
            background: rgba(255, 0, 0, 0.03);
            border: 1px solid rgba(255, 0, 0, 0.2);
            margin-top: 0;
            padding-top: 4px;
        }

        .video-column .column-label {
            font-size: var(--font-section-title);
            font-weight: 600;
            color: var(--materials-accent-dark);
            margin-bottom: 4px;
            padding-left: 4px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            background: rgba(255, 0, 255, 0.05);
        }

        .video-panel-content {
            flex: 1;
            background: transparent;
            border-radius: 0;
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            background: rgba(255, 165, 0, 0.05);
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--button-gap);
            padding: 2px 0px;
            min-height: 0;
            background: rgba(255, 0, 0, 0.03);
        }

        .video-list::-webkit-scrollbar {
            width: 4px;
        }
        .video-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: var(--materials-border);
            border-radius: 4px;
        }

        /* Video items styled exactly like book items */
        .video-item-btn {
            background: var(--materials-bg-item);
            border: 2px solid var(--materials-border);
            border-radius: var(--radius-small);
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: var(--button-height);
            min-height: var(--button-height);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--font-book-item);
            font-weight: 600;
            color: var(--materials-text);
            flex-shrink: 0;
            text-decoration: none;
            border-color: rgba(255, 0, 0, 0.4);
            background: rgba(255, 0, 0, 0.06);
        }

        .video-item-btn:hover {
            border-color: var(--materials-border-hover);
            transform: translateX(4px);
            background: var(--materials-bg-item-hover);
        }

        .video-item-btn:active {
            transform: scale(0.98);
        }

        .video-item-btn .video-icon {
            font-size: calc(var(--font-book-item) + 4px);
            flex-shrink: 0;
            width: 28px;
            text-align: center;
            color: var(--materials-accent);
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-item-btn .video-title {
            font-weight: 600;
            color: var(--materials-text);
            font-size: var(--font-book-item);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .video-item-btn .video-channel {
            font-size: var(--font-video-channel);
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.2;
        }

        .video-item-btn .video-duration {
            font-size: var(--font-video-duration);
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            height: 16px;
            display: flex;
            align-items: center;
            font-weight: 400;
        }

        .video-item-btn .play-icon {
            color: var(--materials-accent);
            font-size: calc(var(--font-book-item) + 4px);
            flex-shrink: 0;
        }

        .no-videos-placeholder {
            color: var(--materials-accent);
            font-size: var(--font-placeholder);
            font-weight: 700;
            text-align: left;
            padding: 8px 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            line-height: 1.2;
            padding-left: 4px;
            background: rgba(255, 255, 0, 0.05);
        }

        /* ===== STAR CYCLER ===== */
        .star-cycler {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            background: var(--bg-star);
            border-radius: 30px;
            padding: 2px 12px;
            border: 1px solid var(--skills-border);
            min-width: 66px;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            height: 28px;
        }

        .star-cycler:hover {
            border-color: var(--skills-border-hover);
            background: var(--skills-bg-item-hover);
            transform: scale(1.02);
        }

        .star-cycler:active {
            transform: scale(0.95);
        }

        .star-cycler .star-display {
            font-size: var(--font-star-label);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .star-cycler .star-display .on {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 184, 80, 0.2);
        }

        .star-cycler .star-display .off {
            color: var(--text-star);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 820px) {
            .app {
                padding: 10px;
                gap: 6px;
                max-height: 98vh;
                min-height: 98vh;
            }

            .sticky-header {
                padding: 10px 10px 4px 10px;
                margin: -10px -10px 0 -10px;
            }

            .header-divider {
                margin: 2px 0 0 0;
            }

            .main-content {
                gap: 8px;
                padding-top: 4px;
            }

            .books-column,
            .skill-column,
            .video-column {
                height: var(--scrollable-area-height);
                max-height: var(--scrollable-area-height);
                min-height: var(--section-min-height);
                padding: 4px;
            }

            .sticky-header .header {
                margin-bottom: 2px;
            }

            .video-column .column-label {
                margin-bottom: 4px;
            }

            .skill-column .column-label {
                margin-bottom: 2px;
            }

            .skill-column .column-label-wrapper {
                margin-bottom: 2px;
                padding-left: 2px;
            }

            .skill-column .reset-btn-small {
                padding: 1px 8px;
                height: var(--button-height);
            }

            .books-column .column-label {
                margin-bottom: 2px;
            }

            .book-item {
                padding: 4px 10px;
                height: var(--button-height);
                min-height: var(--button-height);
            }

            .book-item .icon {
                font-size: calc(var(--font-book-item) + 2px);
                width: 20px;
            }

            .skill-item {
                padding: 5px 10px;
                height: var(--button-height);
                min-height: var(--button-height);
            }

            .skill-item .icon {
                font-size: calc(var(--font-item) + 2px);
                width: 24px;
            }

            .video-item-btn {
                padding: 4px 10px;
                height: var(--button-height);
                min-height: var(--button-height);
            }

            .video-item-btn .video-icon {
                font-size: calc(var(--font-book-item) + 2px);
                width: 20px;
            }

            .video-item-btn .video-duration {
                padding: 1px 4px;
                height: 14px;
            }

            .star-cycler {
                min-width: 56px;
                padding: 1px 10px;
                height: 24px;
            }

            .skill-list {
                gap: var(--button-gap);
                padding: 2px 0px;
            }

            .books-list {
                padding: 2px 0px;
                gap: var(--button-gap);
            }

            .video-list {
                gap: var(--button-gap);
                padding: 2px 0px;
            }
        }

        @media (max-width: 380px) {
            .app {
                padding: 6px;
                gap: 4px;
                max-height: 98vh;
                min-height: 98vh;
            }

            .sticky-header {
                padding: 6px 6px 3px 6px;
                margin: -6px -6px 0 -6px;
            }

            .header-divider {
                margin: 2px 0 0 0;
            }

            .main-content {
                gap: 6px;
                padding-top: 4px;
            }

            .books-column,
            .skill-column,
            .video-column {
                height: var(--scrollable-area-height);
                max-height: var(--scrollable-area-height);
                min-height: var(--section-min-height);
                padding: 4px;
            }

            .sticky-header .header {
                margin-bottom: 2px;
            }

            .video-column .column-label {
                margin-bottom: 4px;
            }

            .skill-column .column-label {
                margin-bottom: 2px;
            }

            .skill-column .column-label-wrapper {
                margin-bottom: 2px;
                padding-left: 2px;
            }

            .skill-column .reset-btn-small {
                padding: 1px 6px;
                height: var(--button-height);
            }

            .books-column .column-label {
                margin-bottom: 2px;
            }

            .book-item {
                padding: 3px 8px;
                height: var(--button-height);
                min-height: var(--button-height);
            }

            .book-item .icon {
                font-size: calc(var(--font-book-item) + 2px);
                width: 18px;
            }

            .skill-item {
                padding: 4px 8px;
                height: var(--button-height);
                min-height: var(--button-height);
                gap: 6px;
            }

            .skill-item .icon {
                font-size: calc(var(--font-item) + 2px);
                width: 20px;
            }

            .video-item-btn {
                padding: 3px 8px;
                height: var(--button-height);
                min-height: var(--button-height);
            }

            .video-item-btn .video-icon {
                font-size: calc(var(--font-book-item) + 2px);
                width: 18px;
            }

            .star-cycler {
                min-width: 48px;
                padding: 1px 8px;
                height: 20px;
            }

            .video-item-btn .video-channel {
                display: none;
            }

            .video-list {
                gap: var(--button-gap);
                padding: 2px 0px;
            }

            .skill-list {
                gap: var(--button-gap);
                padding: 2px 0px;
            }

            .books-list {
                padding: 2px 0px;

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let selectedSkillId = null;
    let skillStars = {};

    for (const id of Object.keys(skillData)) {
        skillStars[id] = 0;
    }

    // ============================================================
    // 3. CORE FUNCTIONS
    // ============================================================
    function handleSkillClick(skillId) {
        selectedSkillId = skillId;
        renderAll();
        showVideos(skillId);
    }

    function cycleStars(skillId, event) {
        event.stopPropagation();
        const current = skillStars[skillId] || 0;
        skillStars[skillId] = (current + 1) % 4;
        renderAll();
        if (selectedSkillId === skillId) {
            showVideos(skillId);
        }
    }

    function resetSkills() {
        if (confirm('Reset all star ratings to 0?')) {
            for (const id of Object.keys(skillData)) {
                skillStars[id] = 0;
            }
            renderAll();
            if (selectedSkillId) {
                showVideos(selectedSkillId);
            }
        }
    }

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================
    function renderList() {
        const container = document.getElementById('skill-list');

        let html = '';
        for (const [id, skill] of Object.entries(skillData)) {
            const isSelected = selectedSkillId === id;
            const selectedClass = isSelected ? ' active' : '';
            const starCount = skillStars[id] || 0;

            let starDisplay = '';
            for (let i = 0; i < 3; i++) {
                const isOn = i < starCount;
                starDisplay += `<span class="${isOn ? 'on' : 'off'}">${isOn ? '⭐' : '☆'}</span>`;
            }

            html += `
                <div class="skill-item${selectedClass}"
                     onclick="handleSkillClick('${id}')"
                     ontouchstart=""
                     title="${skill.description}">
                    <div class="left">
                        <span class="icon">${skill.icon}</span>
                        <span class="name">
                            ${skill.name}
                            <span class="book-ref">${skill.bookRef || ''}</span>
                        </span>
                    </div>
                    <div class="right">
                        <span class="star-cycler" onclick="cycleStars('${id}', event)">
                            <span class="star-display">${starDisplay}</span>
                        </span>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function showVideos(skillId) {
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            videoList.innerHTML = `<div class="no-videos-placeholder">❗ Select a Book and a Skill above</div>`;
            return;
        }

        const skill = skillData[skillId];

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = `<div class="no-videos-placeholder">📖 No videos</div>`;
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">▶</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">↗</span>
                </a>
            `;
        }
        videoList.innerHTML = html;

        // Scroll to top of video list when new videos are loaded
        videoList.scrollTop = 0;
    }

    function renderAll() {
        renderList();
    }

    // ============================================================
    // 5. APP INITIALIZATION
    // ============================================================
    let appInitialized = false;

    function initApp() {
        if (appInitialized) return;
        appInitialized = true;
        renderAll();
        showVideos(null);
        console.log('📚 Faber Piano Adventures - Primer Lesson Book');
        console.log('💡 ' + Object.keys(skillData).length + ' skills available');
        console.log('🎨 Section Colors: Books=Green, Skills=Blue, Materials=Red');
        console.log('📏 Button height: ' + getComputedStyle(document.documentElement).getPropertyValue('--button-height').trim());
        console.log('📏 Section min height: ' + getComputedStyle(document.documentElement).getPropertyValue('--section-min-height').trim());
        console.log('📏 Scrollable area height: ' + getComputedStyle(document.documentElement).getPropertyValue('--scrollable-area-height').trim());
    }

    initApp();
</script>
