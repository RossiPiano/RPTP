<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📚 Faber Piano Adventures - Primer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #e1e1e1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            background: linear-gradient(145deg, #0d0d1a, #14142a);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 98vh;
            max-height: 98vh;
        }

        .test-banner {
            background: #ff6b6b;
            color: #fff;
            padding: 3px 12px;
            text-align: center;
            font-size: 11px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #2a2a4a;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, #f7d94e, #f0a030);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header .stats {
            display: flex;
            gap: 10px;
            background: #0a0a12;
            padding: 3px 10px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            font-size: 12px;
            align-items: center;
        }

        .header .stats span {
            color: #8888aa;
        }

        .header .stats .value {
            color: #f7d94e;
            font-weight: 700;
            font-size: 14px;
        }

        .reset-btn {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            color: #ff6b6b;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .reset-btn:hover {
            background: #3a1a1a;
            border-color: #ff6b6b;
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           TWO-COLUMN LAYOUT (default for wide screens)
           ============================================================ */
        .main-content {
            display: flex;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        /* LEFT COLUMN - Skill List */
        .skill-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .skill-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 4px 4px 8px 2px;
            -webkit-overflow-scrolling: touch;
        }

        .skill-list::-webkit-scrollbar {
            width: 4px;
        }
        .skill-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .skill-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        /* RIGHT COLUMN - Video Panel */
        .video-column {
            width: 340px;
            flex-shrink: 0;
            background: #0a0a12;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }

        .video-column .panel-header {
            font-size: 12px;
            font-weight: 600;
            color: #f7d94e;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .video-column .panel-header .skill-name {
            color: #e1e1e1;
            font-weight: 400;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .video-list::-webkit-scrollbar {
            width: 3px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }

        .video-item-btn {
            background: #1a2a4a;
            border: 1px solid #4a9eff;
            border-radius: 5px;
            padding: 4px 8px;
            color: #6ab0ff;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .video-item-btn:active {
            transform: scale(0.98);
            background: #2a3a5a;
        }

        .video-item-btn .video-icon {
            font-size: 10px;
            flex-shrink: 0;
        }

        .video-item-btn .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item-btn .video-title {
            font-weight: 500;
            color: #eee;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-item-btn .video-channel {
            font-size: 7px;
            color: #8888aa;
            margin-top: 1px;
        }

        .video-item-btn .video-duration {
            font-size: 7px;
            color: #8888aa;
            background: #0a0a12;
            padding: 1px 5px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .video-item-btn .play-icon {
            color: #4a9eff;
            font-size: 10px;
            flex-shrink: 0;
        }

        .no-videos {
            color: #555;
            font-size: 10px;
            padding: 6px 0;
            text-align: center;
        }

        /* ===== SKILL ITEM - TWO COLUMNS ===== */
        .skill-item {
            background: linear-gradient(145deg, #1a2a4a, #1a2a5a);
            border: 2px solid #4a9eff;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .skill-item:active {
            transform: scale(0.98);
        }

        .skill-item:hover {
            border-color: #f7d94e;
            transform: translateX(4px);
        }

        .skill-item.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.15);
        }

        /* LEFT SIDE: Icon + Name + Page */
        .skill-item .left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .skill-item .icon {
            font-size: 16px;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .skill-item .name {
            font-size: 12px;
            font-weight: 600;
            color: #eee;
            line-height: 1.2;
            white-space: nowrap;
        }

        .skill-item .book-ref {
            font-size: 8px;
            color: #8888aa;
            font-weight: 400;
            margin-left: 4px;
        }

        /* ===== STAR CYCLER - Clean version ===== */
        .skill-item .right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .star-cycler {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            background: #0a0a18;
            border-radius: 6px;
            padding: 2px 10px;
            border: 1px solid #2a2a4a;
            min-width: 66px;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            height: 28px;
        }

        .star-cycler:hover {
            border-color: #f7d94e;
            background: #141428;
            transform: scale(1.02);
        }

        .star-cycler:active {
            transform: scale(0.95);
        }

        .star-cycler .star-display {
            font-size: 16px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .star-cycler .star-display .on {
            color: #f7d94e;
            text-shadow: 0 0 10px rgba(247, 217, 78, 0.2);
        }

        .star-cycler .star-display .off {
            color: #2a2a3a;
        }

        /* ===== LEGEND ===== */
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 1px solid #2a2a4a;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            color: #8888aa;
        }

        .legend-item .star-legend {
            font-size: 12px;
        }

        .legend-item .star-legend.on {
            color: #f7d94e;
        }

        .legend-item .star-legend.off {
            color: #2a2a3a;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 820px) {
            .main-content {
                flex-direction: column;
                gap: 8px;
            }

            .video-column {
                width: 100%;
                max-height: 150px;
                flex-shrink: 0;
                order: -1;
                padding: 8px 10px;
            }

            .video-column .panel-header {
                font-size: 11px;
                margin-bottom: 4px;
                padding-bottom: 3px;
            }

            .video-item-btn {
                font-size: 9px;
                padding: 3px 8px;
            }

            .video-item-btn .video-title {
                font-size: 9px;
            }

            .video-item-btn .video-channel {
                font-size: 7px;
            }

            .video-item-btn .video-duration {
                font-size: 7px;
                padding: 1px 4px;
            }

            .no-videos {
                font-size: 9px;
                padding: 4px 0;
            }

            .skill-item {
                padding: 5px 10px;
                min-height: 32px;
            }

            .skill-item .icon {
                font-size: 14px;
                width: 20px;
            }

            .skill-item .name {
                font-size: 11px;
            }

            .skill-item .book-ref {
                font-size: 7px;
            }

            .star-cycler {
                min-width: 56px;
                padding: 1px 8px;
                height: 24px;
            }

            .star-cycler .star-display {
                font-size: 14px;
            }

            .skill-list {
                gap: 2px;
                padding: 2px 2px 4px 2px;
            }

            .header h1 {
                font-size: 16px;
            }

            .header .stats {
                font-size: 10px;
                padding: 2px 8px;
            }

            .header .stats .value {
                font-size: 12px;
            }

            .test-banner {
                font-size: 10px;
                padding: 2px 10px;
            }

            .legend {
                gap: 8px;
                padding-top: 4px;
            }

            .legend-item {
                font-size: 8px;
            }

            .app {
                padding: 10px;
                gap: 6px;
                min-height: 96vh;
                max-height: 96vh;
            }
        }

        @media (max-width: 380px) {
            .app {
                padding: 6px;
                gap: 4px;
            }

            .video-column {
                max-height: 120px;
                padding: 6px 8px;
            }

            .video-column .panel-header {
                font-size: 10px;
            }

            .video-item-btn {
                font-size: 8px;
                padding: 2px 6px;
            }

            .video-item-btn .video-title {
                font-size: 8px;
            }

            .skill-item {
                padding: 4px 8px;
                min-height: 28px;
                gap: 6px;
            }

            .skill-item .icon {
                font-size: 12px;
                width: 18px;
            }

            .skill-item .name {
                font-size: 10px;
            }

            .skill-item .book-ref {
                font-size: 6px;
            }

            .star-cycler {
                min-width: 48px;
                padding: 1px 6px;
                height: 20px;
            }

            .star-cycler .star-display {
                font-size: 12px;
            }

            .header h1 {
                font-size: 14px;
            }

            .header .stats {
                font-size: 9px;
                padding: 2px 6px;
            }

            .header .stats .value {
                font-size: 11px;
            }

            .test-banner {
                font-size: 8px;
                padding: 2px 8px;
            }

            .legend-item {
                font-size: 7px;
            }

            .video-item-btn .video-channel {
                display: none;
            }
        }

        /* Landscape phones */
        @media (max-height: 500px) and (orientation: landscape) {
            .app {
                min-height: 94vh;
                max-height: 94vh;
                padding: 6px;
                gap: 4px;
            }

            .video-column {
                max-height: 100px;
                padding: 4px 8px;
            }

            .video-column .panel-header {
                font-size: 9px;
                margin-bottom: 2px;
                padding-bottom: 2px;
            }

            .video-item-btn {
                font-size: 7px;
                padding: 2px 6px;
            }

            .video-item-btn .video-title {
                font-size: 7px;
            }

            .video-item-btn .video-channel {
                display: none;
            }

            .video-item-btn .video-duration {
                font-size: 6px;
                padding: 1px 3px;
            }

            .no-videos {
                font-size: 7px;
                padding: 2px 0;
            }

            .skill-item {
                padding: 3px 6px;
                min-height: 24px;
                gap: 4px;
            }

            .skill-item .icon {
                font-size: 11px;
                width: 16px;
            }

            .skill-item .name {
                font-size: 9px;
            }

            .skill-item .book-ref {
                font-size: 6px;
            }

            .star-cycler {
                min-width: 42px;
                padding: 1px 6px;
                height: 18px;
            }

            .star-cycler .star-display {
                font-size: 11px;
            }

            .skill-list {
                gap: 2px;
                padding: 2px;
            }

            .header h1 {
                font-size: 13px;
            }

            .header .stats {
                font-size: 8px;
                padding: 2px 6px;
            }

            .header .stats .value {
                font-size: 10px;
            }

            .test-banner {
                font-size: 8px;
                padding: 2px 8px;
            }

            .legend {
                gap: 6px;
                padding-top: 3px;
            }

            .legend-item {
                font-size: 7px;
            }

            @media (min-width: 600px) {
                .main-content {
                    flex-direction: row;
                }

                .video-column {
                    width: 200px;
                    max-height: 300px;
                    order: 0;
                }

                .video-column .panel-header {
                    font-size: 10px;
                }

                .video-item-btn .video-channel {
                    display: block;
                    font-size: 6px;
                }

                .video-item-btn {
                    font-size: 8px;
                }

                .video-item-btn .video-title {
                    font-size: 8px;
                }
            }
        }

        @media (min-width: 600px) and (max-width: 820px) and (orientation: portrait) {
            .video-column {
                max-height: 160px;
            }

            .video-column .panel-header {
                font-size: 12px;
            }

            .video-item-btn {
                font-size: 10px;
            }

            .video-item-btn .video-title {
                font-size: 10px;
            }

            .video-item-btn .video-channel {
                font-size: 8px;
                display: block;
            }

            .skill-item {
                min-height: 34px;
            }

            .skill-item .icon {
                font-size: 15px;
                width: 22px;
            }

            .skill-item .name {
                font-size: 12px;
            }

            .skill-item .book-ref {
                font-size: 8px;
            }

            .star-cycler {
                min-width: 56px;
                height: 24px;
            }

            .star-cycler .star-display {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="test-banner">
        📚 Faber Piano Adventures - Primer Lesson Book
    </div>

    <div class="header">
        <h1>🎹 Piano Skill Tree</h1>
        <div class="stats">
            <span>📚 <span class="value" id="total-skills">0</span> skills</span>
            <span>▶️ <span class="value" id="video-count">0</span> videos</span>
            <button class="reset-btn" onclick="resetSkills()">⟳ Reset</button>
        </div>
    </div>

    <div class="main-content">
        <!-- LEFT COLUMN: Skill List -->
        <div class="skill-column">
            <div class="skill-list" id="skill-list">
                <!-- Dynamically generated -->
            </div>
        </div>

        <!-- RIGHT COLUMN: Video Panel -->
        <div class="video-column" id="video-column">
            <div class="panel-header">
                <span class="skill-name" id="panel-skill-name"></span>
            </div>
            <div class="video-list" id="video-list">
                <!-- Dynamically generated, empty by default -->
            </div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="star-legend on">★★★</span> Mastered</div>
        <div class="legend-item"><span class="star-legend on">★★☆</span> Good Progress</div>
        <div class="legend-item"><span class="star-legend on">★☆☆</span> Started</div>
        <div class="legend-item"><span class="star-legend off">☆☆☆</span> Not Started</div>
        <div class="legend-item" style="color:#555;">🎥 Tap any skill for videos</div>
    </div>
</div>

    // ============================================================
    // 2. APPLICATION STATE
    // ============================================================
    let selectedSkillId = null;

    // Star ratings: 0, 1, 2, 3
    let skillStars = {};

    // Initialize all skills to 0 stars
    for (const id of Object.keys(skillData)) {
        skillStars[id] = 0;
    }

    // ============================================================
    // 3. CORE FUNCTIONS
    // ============================================================
    function handleSkillClick(skillId) {
        selectedSkillId = skillId;
        renderAll();
        showVideos(skillId);
    }

    // Cycle through: 0 -> 1 -> 2 -> 3 -> 0 -> ...
    function cycleStars(skillId, event) {
        event.stopPropagation();
        const current = skillStars[skillId] || 0;
        skillStars[skillId] = (current + 1) % 4; // 0->1->2->3->0
        renderAll();
        if (selectedSkillId === skillId) {
            showVideos(skillId);
        }
    }

    function resetSkills() {
        if (confirm('Reset all star ratings to 0?')) {
            for (const id of Object.keys(skillData)) {
                skillStars[id] = 0;
            }
            renderAll();
            if (selectedSkillId) {
                showVideos(selectedSkillId);
            }
        }
    }

    // ============================================================
    // 4. RENDER FUNCTIONS
    // ============================================================
    function renderList() {
        const container = document.getElementById('skill-list');

        let html = '';
        for (const [id, skill] of Object.entries(skillData)) {
            const isSelected = selectedSkillId === id;
            const selectedClass = isSelected ? ' active' : '';

            // Get star count
            const starCount = skillStars[id] || 0;

            // Build star display
            let starDisplay = '';
            for (let i = 0; i < 3; i++) {
                const isOn = i < starCount;
                starDisplay += `<span class="${isOn ? 'on' : 'off'}">${isOn ? '⭐' : '☆'}</span>`;
            }

            html += `
                <div class="skill-item${selectedClass}"
                     onclick="handleSkillClick('${id}')"
                     ontouchstart=""
                     title="${skill.description}">
                    <div class="left">
                        <span class="icon">${skill.icon}</span>
                        <span class="name">
                            ${skill.name}
                            <span class="book-ref">${skill.bookRef || ''}</span>
                        </span>
                    </div>
                    <div class="right">
                        <span class="star-cycler" onclick="cycleStars('${id}', event)" title="Click to cycle: 0→1→2→3→0">
                            <span class="star-display">${starDisplay}</span>
                        </span>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function showVideos(skillId) {
        const panelName = document.getElementById('panel-skill-name');
        const videoList = document.getElementById('video-list');

        if (!skillId || !skillData[skillId]) {
            panelName.textContent = '';
            videoList.innerHTML = '';
            return;
        }

        const skill = skillData[skillId];
        const starCount = skillStars[skillId] || 0;
        const levelLabels = ['☆☆☆ Not Started', '★☆☆ Started', '★★☆ Good Progress', '★★★ Mastered'];
        panelName.textContent = skill.icon + ' ' + skill.name + ' — ' + levelLabels[starCount];

        if (!skill.videos || skill.videos.length === 0) {
            videoList.innerHTML = '';
            return;
        }

        let html = '';
        for (const video of skill.videos) {
            html += `
                <a href="${video.url}" target="_blank" class="video-item-btn">
                    <span class="video-icon">▶</span>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                    <span class="video-duration">${video.duration}</span>
                    <span class="play-icon">↗</span>
                </a>
            `;
        }
        videoList.innerHTML = html;
    }

    function updateStats() {
        const totalSkills = Object.keys(skillData).length;
        let videoCount = 0;
        for (const skill of Object.values(skillData)) {
            if (skill.videos) videoCount += skill.videos.length;
        }
        document.getElementById('total-skills').textContent = totalSkills;
        document.getElementById('video-count').textContent = videoCount;
    }

    function renderAll() {
        renderList();
        updateStats();
    }

    // ============================================================
    // 5. INITIALIZE
    // ============================================================
    function init() {
        renderAll();
        showVideos(null);
        console.log('📚 Faber Piano Adventures - Primer Lesson Book');
        console.log('💡 ' + Object.keys(skillData).length + ' skills available');
        console.log('🎥 ' + Object.values(skillData).reduce((sum, s) => sum + (s.videos ? s.videos.length : 0), 0) + ' video tutorials');
        console.log('⭐ Click the star area to cycle: 0→1→2→3→0');
    }

    init();
</script>
